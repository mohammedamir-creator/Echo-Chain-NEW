<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Echo Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1230;
    --paper:#FFF8EC;
    --red:#FF5E5B;
    --mint:#3FD9A6;
    --yellow:#FFD23F;
    --purple:#8C7BFF;
    --ink-soft:#2E2150;
    --line:#4A3A72;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(140,123,255,0.16), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(63,217,166,0.14), transparent 42%);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',cursive;
    margin:0;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:14px 14px 24px;
    min-height:100vh;
    min-height:100dvh;
  }
  @media (min-width:900px){
    #app{ max-width:820px; }
    canvas.draw-board{ aspect-ratio:16/10; }
  }
  @media (min-width:1300px){
    #app{ max-width:1000px; }
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:12px;
  }
  .brand .dot{color:var(--yellow);}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:0.3px;}
  .brand span.tag{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink);
    background:var(--mint);
    padding:3px 8px;
    border-radius:20px;
    font-weight:600;
  }
  .panel{
    background:var(--ink-soft);
    border:2px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,0.35);
  }
  .panel.tight{padding:14px 16px;}
  .lede{
    font-size:15px;
    line-height:1.55;
    color:#D9D2F0;
    margin:6px 0 18px;
  }
  .btn{
    font-family:'Baloo 2',cursive;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    background:var(--yellow);
    border:none;
    border-radius:11px;
    padding:11px 20px;
    cursor:pointer;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);
    transition:transform 0.06s ease, box-shadow 0.06s ease;
    width:100%;
    margin-bottom:8px;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,0.4);}
  .btn.red{background:var(--red);color:var(--paper);}
  .btn.mint{background:var(--mint);color:var(--ink);}
  .btn.purple{background:var(--purple);color:var(--paper);}
  .btn.ghost{
    background:transparent;
    border:2px solid var(--line);
    color:var(--paper);
    box-shadow:none;
  }
  .btn.ghost:active{transform:none;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.small{width:auto;padding:9px 14px;font-size:14px;}
  input[type=text], textarea{
    font-family:'Inter',sans-serif;
    font-size:16px;
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--line);
    background:#241a44;
    color:var(--paper);
    margin-bottom:12px;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--mint);}
  label.field-label{
    display:block;
    font-size:13px;
    color:#B9AEDD;
    margin-bottom:6px;
    font-weight:600;
  }
  .code-card{
    background:var(--paper);
    color:var(--ink);
    text-align:center;
    padding:26px 18px 22px;
    border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
    border:3px solid var(--ink);
    margin-bottom:16px;
  }
  .code-card .label{
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    color:#6b5f8f;
  }
  .code-card .code{
    font-family:'Baloo 2',cursive;
    font-size:46px;
    font-weight:800;
    letter-spacing:8px;
    margin:6px 0 12px;
    color:var(--red);
  }
  .player-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .player-tag{
    background:#241a44;
    border:2px solid var(--line);
    border-radius:9px;
    padding:7px 12px;
    font-size:14px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .player-tag .pin{width:7px;height:7px;border-radius:50%;background:var(--mint);}
  .player-tag.host .pin{background:var(--yellow);}
  .progress-track{
    height:10px;
    border-radius:6px;
    background:#241a44;
    border:2px solid var(--line);
    overflow:hidden;
    margin:10px 0 6px;
  }
  .progress-fill{height:100%;background:var(--mint);transition:width 0.3s ease;}
  .muted{color:#B9AEDD;font-size:13px;}
  .center{text-align:center;}
  canvas.draw-board{
    width:100%;
    aspect-ratio:4/2.6;
    max-height:52vh;
    max-height:52dvh;
    background:#fff;
    border-radius:10px;
    border:3px solid var(--ink);
    touch-action:none;
    display:block;
  }
  .drawing-img{
    width:100%;
    border-radius:10px;
    border:3px solid var(--ink);
    background:#fff;
    display:block;
  }
  .toolbar{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;align-items:center;}
  .swatch{
    width:26px;height:26px;border-radius:50%;
    border:2px solid var(--ink-soft);
    cursor:pointer;
  }
  .swatch.active{outline:2px solid var(--yellow);outline-offset:2px;}

  /* ---- drawing tool panel ---- */
  .tool-panel{
    background:#241a44;
    border:2px solid var(--line);
    border-radius:12px;
    padding:10px;
    margin:8px 0 4px;
  }
  .tool-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .tool-row:last-child{margin-bottom:0;}
  .wheel-block{display:flex;gap:10px;align-items:center;}
  .color-wheel{
    position:relative;
    width:72px;height:72px;
    border-radius:50%;
    border:3px solid var(--ink);
    cursor:crosshair;
    background:
      radial-gradient(circle at center, #fff 0%, rgba(255,255,255,0) 62%),
      conic-gradient(from 90deg, red, yellow, lime, cyan, blue, magenta, red);
    touch-action:none;
    flex:0 0 auto;
  }
  .wheel-puck{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 0 0 1.5px rgba(0,0,0,0.6);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .wheel-side{display:flex;flex-direction:column;gap:8px;flex:1;min-width:110px;}
  .current-color-swatch{
    width:100%;
    height:22px;
    border-radius:7px;
    border:2px solid var(--ink);
  }
  input[type=range].lightness-slider{
    -webkit-appearance:none;
    width:100%;
    height:14px;
    border-radius:7px;
    background:linear-gradient(to right, #000, #fff);
    border:2px solid var(--ink);
  }
  input[type=range].lightness-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--yellow);
    border:2px solid var(--ink);
    cursor:pointer;
  }
  input[type=range].lightness-slider::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--yellow);
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .pen-size-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:2px solid var(--line);
    background:#1B1230;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .pen-size-btn .dot{border-radius:50%;background:var(--paper);}
  .pen-size-btn.active{border-color:var(--yellow);background:#33245c;}
  .tool-btn{
    width:38px;height:32px;
    border-radius:8px;
    border:2px solid var(--line);
    background:#1B1230;
    color:var(--paper);
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .tool-btn.active{border-color:var(--yellow);background:#33245c;}
  .tool-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .tool-label{font-size:11px;color:#B9AEDD;font-weight:600;margin-right:2px;}
  .roster-row{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;}
  .roster-chip{
    flex:0 0 auto;
    width:30px;height:30px;
    border-radius:50%;
    background:#241a44;
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
    color:var(--paper);
  }
  .submit-row{display:flex;justify-content:center;margin-top:4px;}
  .btn.compact{width:auto;padding:9px 26px;margin-bottom:0;}
  .slide-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    border:3px solid var(--ink);
    padding:18px;
    text-align:center;
  }
  .slide-card .phrase{font-family:'Baloo 2',cursive;font-size:22px;font-weight:700;}
  .slide-card .by{font-size:12px;color:#6b5f8f;margin-top:10px;font-weight:600;}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;}
  .chip{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:20px;
    border:2px solid var(--line);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:transparent;
    color:var(--paper);
  }
  .chip.active{background:var(--purple);border-color:var(--purple);}
  .mic-circle{
    width:120px;height:120px;
    border-radius:50%;
    border:4px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    margin:16px auto;
    font-size:44px;
    cursor:pointer;
    user-select:none;
  }
  .mic-circle.recording{background:rgba(255,94,91,0.25);animation:pulse 1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,94,91,0.5);}70%{box-shadow:0 0 0 18px rgba(255,94,91,0);}100%{box-shadow:0 0 0 0 rgba(255,94,91,0);}}
  .wave-canvas{
    width:100%;
    height:90px;
    background:#120c26;
    border:2px solid var(--line);
    border-radius:10px;
    margin:10px 0 6px;
    display:block;
  }
  audio{width:100%;margin:8px 0;}
  .vote-option{
    border:2px solid var(--line);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .vote-option.selected{border-color:var(--mint);background:rgba(63,217,166,0.1);}
  .vote-option .name{font-weight:700;font-family:'Baloo 2',cursive;margin-bottom:6px;}
  .leader-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 4px;border-bottom:1px solid var(--line);
  }
  .leader-row:last-child{border-bottom:none;}
  .rank{font-family:'Baloo 2',cursive;font-weight:800;font-size:18px;width:28px;}
  .bar-track{flex:1;height:16px;background:#241a44;border-radius:8px;margin:0 10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--yellow);}
  .error-box{
    border:2px dashed var(--red);
    border-radius:10px;
    padding:12px 14px;
    color:#FFC7C6;
    font-size:14px;
    margin-bottom:12px;
  }
  .footer-note{text-align:center;font-size:12px;color:#8477AB;margin-top:24px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- identity / session state ----------
  const BUILD_VERSION = 'v7-persistent-waveform-compact-ui';
  const myId = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  let myName = '';
  let lobbyCode = '';
  let isHost = false;
  let view = 'home'; // home | join | lobby | game
  let errorMsg = '';
  let meta = null;

  // ---------- paid-access state ----------
  let paymentsCfg = { paymentsEnabled:false, priceCents:500, currency:'usd', productName:'Echo Chain — Host Access' };
  let hasAccess = false;      // can this browser host a lobby?
  let accessToken = '';       // the saved proof-of-purchase code
  let payError = '';
  let buying = false;
  let purchaseJustCompleted = false;

  const CURRENCY_SYMBOLS = { USD:'$', GBP:'£', EUR:'€', CAD:'CA$', AUD:'A$', JPY:'¥' };
  function priceLabel(){
    const amount = (paymentsCfg.priceCents/100).toFixed(2);
    const cur = (paymentsCfg.currency||'usd').toUpperCase();
    const symbol = CURRENCY_SYMBOLS[cur];
    return symbol ? `${symbol}${amount}` : `${amount} ${cur}`;
  }

  async function initPayments(){
    try{
      const res = await fetch('/api/config');
      if(res.ok) paymentsCfg = await res.json();
    }catch(e){ /* server may be starting up; defaults keep the game usable */ }

    if(!paymentsCfg.paymentsEnabled){ hasAccess = true; return; }

    const params = new URLSearchParams(window.location.search);
    const paidSession = params.get('paid_session');
    if(paidSession){
      try{
        const res = await fetch('/api/verify-purchase?session_id=' + encodeURIComponent(paidSession));
        const data = await res.json().catch(()=>({}));
        if(res.ok && data.token){
          accessToken = data.token;
          try{ localStorage.setItem('echoChainAccessToken', accessToken); }catch(e){}
          hasAccess = true;
          purchaseJustCompleted = true;
        } else {
          payError = data.error || 'Could not verify your payment.';
        }
      }catch(e){ payError = 'Could not verify your payment.'; }
      window.history.replaceState({}, document.title, window.location.pathname);
      return;
    }

    let saved = '';
    try{ saved = localStorage.getItem('echoChainAccessToken') || ''; }catch(e){}
    if(saved){
      try{
        const res = await fetch('/api/check-token', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: saved }) });
        const data = await res.json().catch(()=>({}));
        if(data && data.valid){ accessToken = saved; hasAccess = true; }
        else { try{ localStorage.removeItem('echoChainAccessToken'); }catch(e){} }
      }catch(e){ /* network hiccup — leave hasAccess false, they can retry */ }
    }
  }

  async function buyAccess(){
    payError=''; buying=true; render();
    try{
      const res = await fetch('/api/checkout', { method:'POST' });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.url){ window.location.href = data.url; return; }
      payError = data.error || 'Could not start checkout.';
    }catch(e){ payError = 'Could not start checkout.'; }
    buying=false; render();
  }

  async function redeemCode(){
    const el = document.getElementById('redeemInput');
    const code = el ? el.value.trim() : '';
    if(!code) return;
    payError='';
    try{
      const res = await fetch('/api/check-token', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: code }) });
      const data = await res.json().catch(()=>({}));
      if(data && data.valid){
        accessToken = code;
        try{ localStorage.setItem('echoChainAccessToken', code); }catch(e){}
        hasAccess = true;
      } else {
        payError = "That code doesn't look right.";
      }
    }catch(e){ payError = 'Could not check that code.'; }
    render();
  }

  // per-screen ephemeral UI state
  let ui = {
    joinCodeInput:'', joinNameInput:'', hostNameInput:'',
    players:[],
    chainSubmitted:false, chainProgress:{count:0,total:0}, chainTaskCache:null,
    revealChains:[], revealOwnerIdx:0, revealStepIdx:0,
    soundSubmitted:false, soundProgress:{count:0,total:0},
    recording:false, recordedBlob:null, recordedUrl:null, micDenied:false,
    voteEntries:[], voteSelected:null, voteSubmitted:false, voteProgress:{count:0,total:0},
    roundTally:[], finalTally:[]
  };

  let mediaRecorder=null, mediaChunks=[], mediaStream=null;
  let canvasCtx=null, drawing=false, currentColor='#1B1230';
  let currentHue=252, currentSat=45, currentLight=22; // matches the ink color above (HSL)
  let currentSize=8;
  let isEraser=false;
  let undoStack=[], redoStack=[];
  const PEN_SIZES = [4, 8, 14, 22];

  // ---------- storage helpers ----------
  // These talk to the tiny local server (server.js) instead of Claude's
  // artifact storage — the server keeps everything in memory on the host's
  // own machine, so the game works with no internet and no Claude involved
  // once it's running.
  async function sGet(key){
    try{
      const res = await fetch('/api/get?key=' + encodeURIComponent(key));
      if(!res.ok) return null;
      const data = await res.json();
      return data.value ? JSON.parse(data.value) : null;
    }catch(e){ return null; }
  }
  async function sSet(key,val){
    try{
      const res = await fetch('/api/set', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key, value: JSON.stringify(val) })
      });
      if(!res.ok) console.error('storage set failed', await res.text());
      return res.ok;
    }catch(e){ console.error('storage set failed', e); return false; }
  }
  async function sListKeys(prefix){
    try{
      const res = await fetch('/api/list?prefix=' + encodeURIComponent(prefix));
      if(!res.ok) return [];
      const data = await res.json();
      return data.keys || [];
    }catch(e){ return []; }
  }

  function metaKey(){ return `lobby:${lobbyCode}:meta`; }
  function playerKey(id){ return `lobby:${lobbyCode}:players:${id}`; }
  function chainKey(phase, ownerId){ return `lobby:${lobbyCode}:chain:${phase}:${ownerId}`; }
  function soundKey(roundId, pid){ return `lobby:${lobbyCode}:sound:${roundId}:${pid}`; }
  function voteKey(roundId, pid){ return `lobby:${lobbyCode}:vote:${roundId}:${pid}`; }

  function genCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0/I/1
    let c='';
    for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
    return c;
  }

  // ---------- sound presets (procedural, no external audio needed) ----------
  let audioCtx=null;
  function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

  // Every preset's audio routes through this single analyser on its way to the
  // speakers, so we can read the live waveform of whatever sound is playing —
  // procedural or file-based — without wiring up analysis per-preset.
  let _targetAnalyser=null;
  function targetAnalyser(){
    if(!_targetAnalyser){
      _targetAnalyser = ctx().createAnalyser();
      _targetAnalyser.fftSize = 512;
      _targetAnalyser.connect(ctx().destination);
    }
    return _targetAnalyser;
  }

  // ---------- your own custom sounds ----------
  // To add a sound you found or recorded yourself: put an audio file (mp3 or
  // wav works well) in the public/sounds/ folder, then add a line here, e.g.:
  //   { id:'airhorn', name:'Air Horn', desc:'A blaring air horn blast.', file:'sounds/airhorn.mp3' }
  // The id must be unique. That's it — it'll start showing up in the rotation
  // alongside the built-in sounds automatically, no other code changes needed.
  const FILE_PRESETS = [
    // { id:'my-sound', name:'My Sound', desc:'A short description shown to players.', file:'sounds/my-sound.mp3' },
  ];

  const _audioBufferCache = {};
  async function loadAudioBuffer(url){
    if(_audioBufferCache[url]) return _audioBufferCache[url];
    const res = await fetch(url);
    const arrBuf = await res.arrayBuffer();
    const audioBuf = await ctx().decodeAudioData(arrBuf);
    _audioBufferCache[url] = audioBuf;
    return audioBuf;
  }

  const PRESETS = {
    trombone: { name:'Sad Trombone', desc:'Womp womp womp — a slow, defeated descending honk.', play(){
      const c=ctx(); const notes=[220,196,174,146]; let t=c.currentTime;
      notes.forEach((f,i)=>{
        const o=c.createOscillator(), g=c.createGain();
        o.type='sawtooth'; o.frequency.setValueAtTime(f,t);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
        o.connect(g); g.connect(targetAnalyser());
        o.start(t); o.stop(t+0.34);
        t += i===notes.length-2 ? 0.34 : 0.3;
      });
    }},
    boing: { name:'Cartoon Boing', desc:'A springy sine sweep that bounces up then settles.', play(){
      const c=ctx(); const t=c.currentTime;
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(90,t);
      o.frequency.exponentialRampToValueAtTime(700,t+0.18);
      o.frequency.exponentialRampToValueAtTime(260,t+0.4);
      o.frequency.exponentialRampToValueAtTime(400,t+0.55);
      g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
      o.connect(g); g.connect(targetAnalyser()); o.start(t); o.stop(t+0.72);
    }},
    ghost: { name:'Wandering Ghost', desc:'A wobbly "oooOOOooo" that fades into the dark.', play(){
      const c=ctx(); const t=c.currentTime;
      const o=c.createOscillator(), g=c.createGain(), lfo=c.createOscillator(), lfoGain=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.linearRampToValueAtTime(340,t+1.4);
      lfo.type='sine'; lfo.frequency.setValueAtTime(5,t);
      lfoGain.gain.setValueAtTime(25,t);
      lfo.connect(lfoGain); lfoGain.connect(o.frequency);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.25);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
      o.connect(g); g.connect(targetAnalyser());
      o.start(t); lfo.start(t); o.stop(t+1.5); lfo.stop(t+1.5);
    }},
    robot: { name:'Robot Beep-Boop', desc:'Four sharp square-wave beeps, like a droid saying hello.', play(){
      const c=ctx(); const notes=[520,390,520,700]; let t=c.currentTime;
      notes.forEach(f=>{
        const o=c.createOscillator(), g=c.createGain();
        o.type='square'; o.frequency.setValueAtTime(f,t);
        g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
        o.connect(g); g.connect(targetAnalyser()); o.start(t); o.stop(t+0.12);
        t += 0.15;
      });
    }},
    stinger: { name:'Dramatic Stinger', desc:'Dun. Dun. DUNNNN. A courtroom-reveal sting.', play(){
      const c=ctx(); const t=c.currentTime;
      [[130,0.18],[130,0.18],[98,0.9]].forEach(([f,dur],i)=>{
        const start = t + i*0.32;
        const o=c.createOscillator(), g=c.createGain();
        o.type='sawtooth'; o.frequency.setValueAtTime(f,start);
        g.gain.setValueAtTime(0.001,start); g.gain.exponentialRampToValueAtTime(0.28,start+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,start+dur);
        o.connect(g); g.connect(targetAnalyser()); o.start(start); o.stop(start+dur+0.02);
      });
    }},
    whistle: { name:'Slide Whistle', desc:'A bright sine that slides all the way up in under a second.', play(){
      const c=ctx(); const t=c.currentTime;
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(1500,t+0.55);
      g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.06);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
      o.connect(g); g.connect(targetAnalyser()); o.start(t); o.stop(t+0.62);
    }}
  };
  const PRESET_IDS = Object.keys(PRESETS);

  function getSoundDef(id){
    if(PRESETS[id]) return PRESETS[id];

        g.gain.value = 0.85;
        src.buffer = buf;
        src.connect(g); g.connect(targetAnalyser());

  function myChainTask(){

  function hslToHex(h,s,l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  function updateCurrentColor(){
    currentColor = hslToHex(currentHue, currentSat, currentLight);
    const sw = document.getElementById('currentColorSwatch');
    if(sw) sw.style.background = currentColor;
  }

  function positionWheelPuck(){
    const wheel = document.getElementById('colorWheel');
    const puck = document.getElementById('wheelPuck');
    if(!wheel || !puck) return;
    const r = wheel.clientWidth/2;
    const dist = (currentSat/100) * r;
    const rad = (currentHue - 90) * Math.PI/180;
    puck.style.left = (r + dist*Math.cos(rad)) + 'px';
    puck.style.top = (r + dist*Math.sin(rad)) + 'px';
    puck.style.background = currentColor;
  }

  function pushUndoSnapshot(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !canvasCtx) return;
    try{
      undoStack.push(canvasCtx.getImageData(0,0,canvas.width,canvas.height));
      if(undoStack.length > 25) undoStack.shift();
      redoStack = [];
      updateUndoRedoButtons();
    }catch(e){}
  }
  function updateUndoRedoButtons(){
    const u = document.getElementById('undoBtn');
    const r = document.getElementById('redoBtn');
    if(u) u.style.opacity = undoStack.length>1 ? '1' : '0.3';
    if(r) r.style.opacity = redoStack.length>0 ? '1' : '0.3';
  }
  function doUndo(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !canvasCtx || undoStack.length<=1) return;
    const current = undoStack.pop();
    redoStack.push(current);
    canvasCtx.putImageData(undoStack[undoStack.length-1], 0, 0);
    updateUndoRedoButtons();
  }
  function doRedo(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !canvasCtx || !redoStack.length) return;
    const next = redoStack.pop();
    undoStack.push(next);
    canvasCtx.putImageData(next, 0, 0);
    updateUndoRedoButtons();
  }

  function setupCanvasIfNeeded(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas) return;
    if(canvasCtx && canvas.dataset.wired==='1') return; // already set up for this task — don't reset the drawing
    canvas.width = canvas.clientWidth * 2;
    canvas.height = canvas.clientHeight * 2;
    const ctx2d = canvas.getContext('2d');
    ctx2d.fillStyle = '#fff';
    ctx2d.fillRect(0,0,canvas.width,canvas.height);
    ctx2d.lineJoin='round'; ctx2d.lineCap='round';
    canvasCtx = ctx2d;
    canvas.dataset.wired = '1';

    // fresh tool state for each new drawing task
    currentHue=252; currentSat=45; currentLight=22; currentSize=8; isEraser=false;
    updateCurrentColor();
    positionWheelPuck();
    // the HTML for the pen/eraser buttons was built with the *previous* task's
    // settings, so sync their active classes to the freshly-reset state
    document.querySelectorAll('.pen-size-btn').forEach(b=>{
      b.classList.toggle('active', parseInt(b.getAttribute('data-size'),10)===currentSize);
    });
    const eraserBtnEl = document.getElementById('eraserBtn');
    if(eraserBtnEl) eraserBtnEl.classList.remove('active');
    const lightSlider = document.getElementById('lightnessSlider');
    if(lightSlider) lightSlider.value = currentLight;
    undoStack=[]; redoStack=[];
    pushUndoSnapshot(); // blank canvas as the first undo state

    let last=null;
    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
      return { x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height) };
    }
    function start(e){ drawing=true; last=posFromEvent(e); e.preventDefault(); }
    function move(e){
      if(!drawing) return;
      const p = posFromEvent(e);
      ctx2d.strokeStyle = isEraser ? '#ffffff' : currentColor;
      ctx2d.lineWidth = (isEraser ? currentSize*2.2 : currentSize) * 2; // *2 to match the 2x canvas backing resolution
      ctx2d.beginPath(); ctx2d.moveTo(last.x,last.y); ctx2d.lineTo(p.x,p.y); ctx2d.stroke();
      last = p; e.preventDefault();
    }
    function end(){
      if(drawing) pushUndoSnapshot();
      drawing=false;
    }
    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);

    // ---- color wheel ----
    const wheel = document.getElementById('colorWheel');
    if(wheel){
      let picking=false;
      function pickFromEvent(e){
        const rect = wheel.getBoundingClientRect();
        const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left - rect.width/2;
        const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top - rect.height/2;
        let dist = Math.sqrt(cx*cx + cy*cy) / (rect.width/2);
        dist = Math.min(1, dist);
        let angle = Math.atan2(cy, cx) * 180/Math.PI + 90;
        if(angle < 0) angle += 360;
        currentHue = angle;
        currentSat = Math.round(dist*100);
        updateCurrentColor();
        positionWheelPuck();
      }
      function wheelStart(e){ picking=true; pickFromEvent(e); e.preventDefault(); }
      function wheelMove(e){ if(!picking) return; pickFromEvent(e); e.preventDefault(); }
      function wheelEnd(){ picking=false; }
      wheel.addEventListener('mousedown',wheelStart); wheel.addEventListener('mousemove',wheelMove); window.addEventListener('mouseup',wheelEnd);
      wheel.addEventListener('touchstart',wheelStart,{passive:false}); wheel.addEventListener('touchmove',wheelMove,{passive:false}); wheel.addEventListener('touchend',wheelEnd);
    }
  }

  async function loadReveal(){

        if(step) steps.push(step);
      }
      const ownerName = ui.players.find(p=>p.id===ownerId)?.name || '???';
      chains.push({ownerId, ownerName, steps});

    ui.revealChains = chains; ui.revealOwnerIdx=0; ui.revealStepIdx=0;

  // ---------- actions: sound round ----------
  async function startSoundRound(){
    const usedPresets = meta.soundRounds.map(r=>r.preset);
    let available = allSoundIds().filter(id=>!usedPresets.includes(id));
    if(available.length===0) available = allSoundIds();
    const preset = available[Math.floor(Math.random()*available.length)];
    const roundId = 's' + meta.soundRoundCount;
    const newMeta = Object.assign({}, meta, {
      status:'sound_record', soundPreset:preset, soundRoundId:roundId,
      soundRoundCount: meta.soundRoundCount+1,
      soundRounds: meta.soundRounds.concat([{id:roundId, preset}])
    });

    ui.soundSubmitted=false; ui.recordedBlob=null; ui.recordedUrl=null; ui.micDenied=false;
    resetWaveforms();
    render();

  // ---------- waveform drawing (target sound vs. your own voice) ----------
  // These store the *entire history* of peak loudness over each clip's
  // duration (like a real audio-editor waveform), not just the current
  // instant — so the picture stays put after the sound finishes instead of
  // settling back to a flat line once the audio goes quiet.
  let targetEnvelope=[], liveEnvelope=[];
  let targetWaveAnimId=null, liveWaveAnimId=null;
  let _nextSoundDurationMs = 1700; // procedural presets use this default; file presets override it once decoded

  function sizeWaveCanvas(){
    const c = document.getElementById('waveCanvas');
    if(!c) return null;
    if(c.width !== c.clientWidth*2 || c.height !== c.clientHeight*2){
      c.width = c.clientWidth*2; c.height = c.clientHeight*2;
    }
    return c;
  }
  function resampleEnvelope(arr, n){
    if(!arr || !arr.length) return null;
    const out = new Array(n);
    for(let i=0;i<n;i++){
      out[i] = arr[Math.min(arr.length-1, Math.floor(i*arr.length/n))];
    }
    return out;
  }
  function drawEnvelopeBars(ctx2d, w, h, envelope, color, alpha){
    if(!envelope) return;
    const barCount = envelope.length;
    const gap = w / barCount;
    const barWidth = gap * 0.55;
    ctx2d.globalAlpha = alpha;
    ctx2d.fillStyle = color;
    for(let i=0;i<barCount;i++){
      const barHeight = Math.max(h*0.035, envelope[i] * h*0.92);
      const x = i*gap + (gap-barWidth)/2;
      const y = (h-barHeight)/2;
      ctx2d.fillRect(x, y, barWidth, barHeight);
    }
    ctx2d.globalAlpha = 1;
  }
  function renderWaveCanvas(){
    const c = sizeWaveCanvas();
    if(!c) return;
    const g = c.getContext('2d');
    g.clearRect(0,0,c.width,c.height);
    const BARS = 40;
    // faint baseline bars so the panel doesn't look empty before anything plays
    drawEnvelopeBars(g, c.width, c.height, new Array(BARS).fill(0), '#3a2e63', 1);
    drawEnvelopeBars(g, c.width, c.height, resampleEnvelope(targetEnvelope, BARS), '#8C7BFF', 0.9);
    drawEnvelopeBars(g, c.width, c.height, resampleEnvelope(liveEnvelope, BARS), '#FF5E5B', 0.8);
  }
  function resetWaveforms(){
    targetEnvelope=[]; liveEnvelope=[];
    if(targetWaveAnimId) cancelAnimationFrame(targetWaveAnimId);
    if(liveWaveAnimId) cancelAnimationFrame(liveWaveAnimId);
    targetWaveAnimId=null; liveWaveAnimId=null;
  }
  function peakOf(byteData){
    let maxDev = 0;
    for(let i=0;i<byteData.length;i++){
      const dev = Math.abs(byteData[i]/128 - 1);
      if(dev>maxDev) maxDev = dev;
    }
    return maxDev;
  }
  async function playTargetSound(def){
    if(ctx().state==='suspended'){ try{ await ctx().resume(); }catch(e){} }
    _nextSoundDurationMs = 1700; // reset to the procedural default; file sounds override this inside their own play()
    try{ await def.play(); }catch(e){ return; }
    if(targetWaveAnimId) cancelAnimationFrame(targetWaveAnimId);
    targetEnvelope = [];
    const analyser = targetAnalyser();
    const data = new Uint8Array(analyser.fftSize);
    const start = performance.now();
    const durationMs = _nextSoundDurationMs;
    function tick(){
      analyser.getByteTimeDomainData(data);
      targetEnvelope.push(peakOf(data));
      renderWaveCanvas();
      if(performance.now()-start < durationMs){ targetWaveAnimId = requestAnimationFrame(tick); }
    }
    tick();
  }

  async function toggleRecording(){
    if(ui.recording){
      if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
      ui.recording=false; render();
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
      if(ctx().state==='suspended'){ try{ await ctx().resume(); }catch(e){} }
      mediaChunks=[];
      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) mediaChunks.push(e.data); };
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(mediaChunks, {type: mediaChunks[0]?.type || 'audio/webm'});
        ui.recordedBlob = blob;
        ui.recordedUrl = URL.createObjectURL(blob);
        if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
        if(liveWaveAnimId){ cancelAnimationFrame(liveWaveAnimId); liveWaveAnimId=null; }
        render();
      };
      mediaRecorder.start();
      ui.recording=true;
      liveEnvelope = [];
      render();

      // draw the live mic waveform (analysis only — never routed to speakers,
      // or the player would hear their own voice echoed back)
      const micAnalyser = ctx().createAnalyser();
      micAnalyser.fftSize = 512;
      ctx().createMediaStreamSource(mediaStream).connect(micAnalyser);
      const micData = new Uint8Array(micAnalyser.fftSize);
      function micTick(){
        if(!ui.recording) return;
        micAnalyser.getByteTimeDomainData(micData);
        liveEnvelope.push(peakOf(micData));
        renderWaveCanvas();
        liveWaveAnimId = requestAnimationFrame(micTick);
      }
      micTick();

      setTimeout(()=>{ if(ui.recording && mediaRecorder && mediaRecorder.state!=='inactive'){ mediaRecorder.stop(); ui.recording=false; } }, 6000);
    }catch(e){
      ui.micDenied=true; render();
    }
  }

  function blobToBase64(blob){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function computeRoundTally(roundId){
    const entryKeys = await sListKeys(`lobby:${lobbyCode}:sound:${roundId}:`);
    const entries = await Promise.all(entryKeys.map(async k=>{
      const pid = k.split(':').pop();
      const v = await sGet(k);
      return {pid, name: v ? v.name : '???'};
    }));
    const voteKeys = await sListKeys(`lobby:${lobbyCode}:vote:${roundId}:`);
    const votes = await Promise.all(voteKeys.map(k=>sGet(k)));
    const counts = {};
    entries.forEach(e=>counts[e.pid]=0);
    votes.forEach(v=>{ if(v && counts[v.votedFor]!==undefined) counts[v.votedFor]++; });
    return entries.map(e=>({name:e.name, votes:counts[e.pid]||0})).sort((a,b)=>b.votes-a.votes);
  }

  async function finishGame(){
    const totals = {};
    const names = {};
    for(const round of meta.soundRounds){
      const entryKeys = await sListKeys(`lobby:${lobbyCode}:sound:${round.id}:`);
      for(const k of entryKeys){
        const pid = k.split(':').pop();
        const v = await sGet(k);
        if(v) names[pid]=v.name;
        if(totals[pid]===undefined) totals[pid]=0;
      }
      const voteKeys = await sListKeys(`lobby:${lobbyCode}:vote:${round.id}:`);
      const votes = await Promise.all(voteKeys.map(k=>sGet(k)));
      votes.forEach(v=>{ if(v && totals[v.votedFor]!==undefined) totals[v.votedFor]++; });
    }
    const rows = Object.keys(totals).map(pid=>({name:names[pid]||'???', votes:totals[pid]})).sort((a,b)=>b.votes-a.votes);
    ui.finalTally = rows;
    const newMeta = Object.assign({}, meta, {status:'final'});
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    render();
  }

  // ---------- polling / sync ----------
  let lastStatusSeen = null;
  async function refreshAndRender(){
    if(!lobbyCode) return;
    const freshMeta = await sGet(metaKey());
    if(!freshMeta){ return; }
    const statusChanged = !meta || meta.status!==freshMeta.status || meta.phaseIndex!==freshMeta.phaseIndex || meta.soundRoundId!==freshMeta.soundRoundId;
    meta = freshMeta;

    if(meta.status==='lobby'){
      ui.players = await fetchPlayers();
      render();
      return;
    }

    if(view==='lobby' && meta.status!=='lobby'){
      // host has started the game
      view='game';
      ui.players = await fetchPlayers();
    }

    if(meta.status==='chain'){
      if(statusChanged){ ui.chainSubmitted=false; ui.chainTaskCache=null; }
      const task = myChainTask();
      const mine = await sGet(chainKey(meta.phaseIndex, task.ownerId));
      // only count as "submitted" for me if the entry was written by me this phase
      const submittedByMe = !!(mine && mine.byPlayerId===myId);
      const submissionChanged = submittedByMe !== ui.chainSubmitted;
      ui.chainSubmitted = submittedByMe;
      if(task.kind!=='write' && !ui.chainTaskCache){
        ui.chainTaskCache = await sGet(chainKey(meta.phaseIndex-1, task.ownerId));
      }
      const progressKeys = await sListKeys(`lobby:${lobbyCode}:chain:${meta.phaseIndex}:`);
      ui.chainProgress = {count: progressKeys.length, total: meta.N};
      if(isHost && progressKeys.length>=meta.N){
        await advanceChainPhase();
        return;
      }
      // Only rebuild the DOM when something actually changed, or while waiting
      // (post-submit) so the progress bar updates. Never rebuild mid-task, or
      // an in-progress drawing on the canvas would get wiped by the redraw.
      if(statusChanged || submissionChanged || ui.chainSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='chain_reveal'){
      if(statusChanged || ui.revealChains.length===0) await loadReveal();
      render();
      return;
    }

    if(meta.status==='sound_record'){
      if(statusChanged){ ui.soundSubmitted=false; ui.recordedBlob=null; ui.recordedUrl=null; ui.micDenied=false; }
      const mine = await sGet(soundKey(meta.soundRoundId, myId));
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.soundSubmitted;
      ui.soundSubmitted = submittedByMe;
      const keys = await sListKeys(`lobby:${lobbyCode}:sound:${meta.soundRoundId}:`);
      ui.soundProgress = {count: keys.length, total: meta.N};
      // Skip rebuilding the DOM while someone is mid-recording or typing a
      // fallback answer — a redraw here would drop their in-progress take.
      if(statusChanged || submissionChanged || ui.soundSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='sound_vote'){
      let entriesLoaded = false;
      if(statusChanged || ui.voteEntries.length===0){
        const keys = await sListKeys(`lobby:${lobbyCode}:sound:${meta.soundRoundId}:`);
        const entries = await Promise.all(keys.map(async k=>{
          const pid = k.split(':').pop();
          const v = await sGet(k);
          return v ? Object.assign({pid}, v) : null;
        }));
        ui.voteEntries = entries.filter(Boolean);
        ui.voteSelected=null; ui.voteSubmitted=false;
        entriesLoaded = true;
      }
      const mine = await sGet(voteKey(meta.soundRoundId, myId));
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.voteSubmitted;
      ui.voteSubmitted = submittedByMe;
      const voteKeys = await sListKeys(`lobby:${lobbyCode}:vote:${meta.soundRoundId}:`);
      ui.voteProgress = {count: voteKeys.length, total: meta.N};
      if(isHost && voteKeys.length>=meta.N){
        ui.roundTally = await computeRoundTally(meta.soundRoundId);
        const newMeta = Object.assign({}, meta, {status:'sound_results'});
        await sSet(metaKey(), newMeta);
        meta = newMeta;
        render();
        return;
      }
      // Skip rebuilding the DOM while someone is mid-playback comparing takes —
      // a redraw would recreate the <audio> elements and stop playback.
      if(statusChanged || entriesLoaded || submissionChanged || ui.voteSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='sound_results'){
      if(statusChanged || ui.roundTally.length===0) ui.roundTally = await computeRoundTally(meta.soundRoundId);
      render();
      return;
    }

    if(meta.status==='final'){
      render();
      return;
    }
  }

  let pollTimer=null;
  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refreshAndRender, 1800);
  }

  (async function boot(){
    await initPayments();
    render();
  })();
})();
</script>
</body>
</html>
