<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Echo Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1230;
    --paper:#FFF8EC;
    --red:#FF5E5B;
    --mint:#3FD9A6;
    --yellow:#FFD23F;
    --purple:#8C7BFF;
    --blue:#3EC6F0;
    --orange:#FF9E3D;
    --pink:#FF6FB5;
    --green:#5FD35C;
    --ink-soft:#2E2150;
    --line:#4A3A72;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(140,123,255,0.20), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(63,217,166,0.16), transparent 42%),
      radial-gradient(circle at 90% 10%, rgba(62,198,240,0.14), transparent 38%),
      radial-gradient(circle at 8% 90%, rgba(255,111,181,0.14), transparent 38%),
      radial-gradient(circle at 50% 50%, rgba(255,158,61,0.06), transparent 60%);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',cursive;
    margin:0;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:14px 14px 24px;
    min-height:100vh;
    min-height:100dvh;
  }
  @media (min-width:900px){
    #app{ max-width:820px; }
    canvas.draw-board{ aspect-ratio:16/10; }
  }
  @media (min-width:1300px){
    #app{ max-width:1000px; }
  }
  /* Monopoly specifically needs much more width to fit the board + a
     spacious sidebar side by side without wasting the rest of the screen */
  body.mp-wide #app{ max-width:1500px; }
  /* Monopoly needs the whole viewport height accounted for so nothing has
     to scroll — everything else in the app keeps its normal document flow.
     Scoped to desktop widths: on mobile a stacked board+sidebar genuinely
     can't fit one screen, so forcing zero-scroll there would just hide
     content instead of fixing anything. */
  @media (min-width:900px){
    body.mp-wide{ overflow:hidden; }
    body.mp-wide #app{
      height:100vh;
      height:100dvh;
      display:flex;
      flex-direction:column;
      box-sizing:border-box;
      padding-bottom:8px;
    }
    body.mp-wide .brand{ flex:0 0 auto; }
    body.mp-wide .mp-page{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .brand .dot{color:var(--yellow);}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:0.3px;}
  .brand-logo{
    height:46px;
    width:auto;
    display:block;
  }
  .brand span.tag{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink);
    background:var(--mint);
    padding:3px 8px;
    border-radius:20px;
    font-weight:600;
  }
  .panel{
    background:var(--ink-soft);
    border:2px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,0.35);
  }
  .panel.tight{padding:14px 16px;}
  .lede{
    font-size:15px;
    line-height:1.55;
    color:#D9D2F0;
    margin:6px 0 18px;
  }
  .btn{
    font-family:'Baloo 2',cursive;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    background:var(--yellow);
    border:none;
    border-radius:11px;
    padding:11px 20px;
    cursor:pointer;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);
    transition:transform 0.06s ease, box-shadow 0.06s ease;
    width:100%;
    margin-bottom:8px;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,0.4);}
  .btn.red{background:var(--red);color:var(--paper);}
  .btn.mint{background:var(--mint);color:var(--ink);}
  .btn.purple{background:var(--purple);color:var(--paper);}
  .btn.blue{background:var(--blue);color:var(--ink);}
  .btn.orange{background:var(--orange);color:var(--ink);}
  .btn.pink{background:var(--pink);color:var(--ink);}
  .btn.green{background:var(--green);color:var(--ink);}
  .btn.ghost{
    background:transparent;
    border:2px solid var(--line);
    color:var(--paper);
    box-shadow:none;
  }
  .btn.ghost:active{transform:none;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.small{width:auto;padding:9px 14px;font-size:14px;}
  input[type=text], textarea{
    font-family:'Inter',sans-serif;
    font-size:16px;
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--line);
    background:#241a44;
    color:var(--paper);
    margin-bottom:12px;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--mint);}
  label.field-label{
    display:block;
    font-size:13px;
    color:#B9AEDD;
    margin-bottom:6px;
    font-weight:600;
  }
  .code-card{
    background:var(--paper);
    color:var(--ink);
    text-align:center;
    padding:26px 18px 22px;
    border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
    border:3px solid var(--ink);
    margin-bottom:16px;
  }
  .code-card .label{
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    color:#6b5f8f;
  }
  .code-card .code{
    font-family:'Baloo 2',cursive;
    font-size:46px;
    font-weight:800;
    letter-spacing:8px;
    margin:6px 0 12px;
    color:var(--red);
  }
  .player-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .player-tag{
    background:#241a44;
    border:2px solid var(--line);
    border-radius:9px;
    padding:7px 12px;
    font-size:14px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .player-tag .pin{width:7px;height:7px;border-radius:50%;background:var(--mint);}
  .player-tag.host .pin{background:var(--yellow);}
  .progress-track{
    height:10px;
    border-radius:6px;
    background:#241a44;
    border:2px solid var(--line);
    overflow:hidden;
    margin:10px 0 6px;
  }
  .progress-fill{height:100%;background:var(--mint);transition:width 0.3s ease;}
  .muted{color:#B9AEDD;font-size:13px;}
  .center{text-align:center;}
  canvas.draw-board{
    width:100%;
    aspect-ratio:4/2.6;
    max-height:52vh;
    max-height:52dvh;
    background:#fff;
    border-radius:10px;
    border:3px solid var(--ink);
    touch-action:none;
    display:block;
  }
  .drawing-img{
    width:100%;
    border-radius:10px;
    border:3px solid var(--ink);
    background:#fff;
    display:block;
  }
  .toolbar{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;align-items:center;}
  .swatch{
    width:26px;height:26px;border-radius:50%;
    border:2px solid var(--ink-soft);
    cursor:pointer;
  }
  .swatch.active{outline:2px solid var(--yellow);outline-offset:2px;}

  /* ---- drawing tool panel ---- */
  .tool-panel{
    background:#241a44;
    border:2px solid var(--line);
    border-radius:12px;
    padding:10px;
    margin:8px 0 4px;
  }
  .tool-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .tool-row:last-child{margin-bottom:0;}
  .wheel-block{display:flex;gap:10px;align-items:center;}
  .color-wheel{
    position:relative;
    width:72px;height:72px;
    border-radius:50%;
    border:3px solid var(--ink);
    cursor:crosshair;
    background:
      radial-gradient(circle at center, #fff 0%, rgba(255,255,255,0) 62%),
      conic-gradient(from 90deg, red, yellow, lime, cyan, blue, magenta, red);
    touch-action:none;
    flex:0 0 auto;
  }
  .wheel-puck{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 0 0 1.5px rgba(0,0,0,0.6);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .wheel-side{display:flex;flex-direction:column;gap:8px;flex:1;min-width:110px;}
  .current-color-swatch{
    width:100%;
    height:22px;
    border-radius:7px;
    border:2px solid var(--ink);
  }
  input[type=range].lightness-slider{
    -webkit-appearance:none;
    width:100%;
    height:14px;
    border-radius:7px;
    background:linear-gradient(to right, #000, #fff);
    border:2px solid var(--ink);
  }
  input[type=range].lightness-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--yellow);
    border:2px solid var(--ink);
    cursor:pointer;
  }
  input[type=range].lightness-slider::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--yellow);
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .pen-size-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:2px solid var(--line);
    background:#1B1230;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .pen-size-btn .dot{border-radius:50%;background:var(--paper);}
  .pen-size-btn.active{border-color:var(--yellow);background:#33245c;}
  .tool-btn{
    width:38px;height:32px;
    border-radius:8px;
    border:2px solid var(--line);
    background:#1B1230;
    color:var(--paper);
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .tool-btn.active{border-color:var(--yellow);background:#33245c;}
  .tool-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .tool-label{font-size:11px;color:#B9AEDD;font-weight:600;margin-right:2px;}
  .roster-row{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;}
  .roster-chip{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:50%;
    background:#DCCFA8;
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
    color:var(--ink);
    overflow:hidden;
    padding:3px;
  }
  .roster-chip img{width:100%;height:100%;object-fit:contain;animation:charBob 2.6s ease-in-out infinite;}
  .submit-row{display:flex;justify-content:center;margin-top:4px;}
  .btn.compact{width:auto;padding:9px 26px;margin-bottom:0;}
  .char-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px;
    margin:8px 0 16px;
  }
  .char-badge{
    aspect-ratio:1;
    border-radius:14px;
    background:#DCCFA8;
    border:3px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    padding:8px;
    box-shadow:3px 3px 0 rgba(0,0,0,0.3);
  }
  .char-badge img{width:100%;height:100%;object-fit:contain;animation:charBob 2.6s ease-in-out infinite;}
  @keyframes charBob{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4%) rotate(-2deg); }
  }
  .char-grid .char-badge:nth-child(2n) img{ animation-delay:0.4s; }
  .char-grid .char-badge:nth-child(3n) img{ animation-delay:0.8s; }
  .char-grid .char-badge:nth-child(5n) img{ animation-delay:1.3s; }
  .roster-row .roster-chip:nth-child(2n) img{ animation-delay:0.4s; }
  .roster-row .roster-chip:nth-child(3n) img{ animation-delay:0.8s; }
  /* a little colour rotation through the badges so the grids feel as
     rainbow as the logo, without needing per-character theming */
  .char-grid .char-badge:nth-child(5n+1){ border-color:var(--pink); }
  .char-grid .char-badge:nth-child(5n+2){ border-color:var(--blue); }
  .char-grid .char-badge:nth-child(5n+3){ border-color:var(--green); }
  .char-grid .char-badge:nth-child(5n+4){ border-color:var(--orange); }
  .char-grid .char-badge:nth-child(5n+5){ border-color:var(--purple); }
  .roster-row .roster-chip:nth-child(5n+1){ border-color:var(--pink); }
  .roster-row .roster-chip:nth-child(5n+2){ border-color:var(--blue); }
  .roster-row .roster-chip:nth-child(5n+3){ border-color:var(--green); }
  .roster-row .roster-chip:nth-child(5n+4){ border-color:var(--orange); }
  .roster-row .roster-chip:nth-child(5n+5){ border-color:var(--purple); }
  /* the selected/active state must always win over the rainbow rotation
     above, so this needs matching specificity and to come after it */
  .char-grid .char-badge.active{ border-color:var(--yellow); }

  /* ---- Impression Stage ---- */
  .impr-prompt-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    border:3px solid var(--ink);
    padding:18px;
    text-align:center;
    margin-bottom:14px;
  }
  .impr-prompt-card .label{font-size:12px;font-weight:700;letter-spacing:1px;color:#6b5f8f;}
  .impr-prompt-card .prompt{font-family:'Baloo 2',cursive;font-size:21px;font-weight:800;margin-top:6px;}
  .impr-stage-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0;}
  .impr-stage-badge{
    width:74px;height:74px;
    border-radius:16px;
    background:var(--paper);
    border:3px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    padding:8px;
  }
  .impr-stage-badge img{width:100%;height:100%;object-fit:contain;}
  .impr-stage-name{text-align:center;font-size:12px;font-weight:700;color:#B9AEDD;margin-top:4px;}
  .impr-stage-col{display:flex;flex-direction:column;align-items:center;}
  .impr-stage-badge.speaking{
    border-color:var(--yellow);
    box-shadow:0 0 0 4px rgba(255,210,63,0.35);
  }
  .impr-stage-badge.speaking img{ animation:charSpeak 0.5s ease-in-out infinite; }
  @keyframes charSpeak{
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    50% { transform: translateY(-10%) rotate(-6deg) scale(1.08); }
  }
  .impr-vote-grid{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0;}
  .impr-vote-badge{
    width:84px;height:84px;
    border-radius:16px;
    background:var(--paper);
    border:3px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    padding:10px;
    cursor:pointer;
  }
  .impr-vote-badge img{width:100%;height:100%;object-fit:contain;}
  .impr-vote-badge.selected{border-color:var(--mint);box-shadow:0 0 0 4px rgba(63,217,166,0.35);}
  .impr-vote-badge.disabled{opacity:0.4;cursor:not-allowed;}

  /* ---- Codenames ---- */
  .cn-team-btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:3px solid var(--line);
    text-align:center;
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
  }
  .cn-team-row{display:flex;gap:10px;margin-bottom:10px;}
  .cn-team-btn.red{color:var(--red);}
  .cn-team-btn.blue{color:var(--blue);}
  .cn-team-btn.active.red{background:rgba(255,94,91,0.18);border-color:var(--red);}
  .cn-team-btn.active.blue{background:rgba(62,198,240,0.18);border-color:var(--blue);}
  .cn-role-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:2px solid var(--line);
    text-align:center;
    font-weight:700;
    cursor:pointer;
  }
  .cn-role-row{display:flex;gap:8px;margin-bottom:14px;}
  .cn-role-btn.active{border-color:var(--yellow);background:#33245c;}
  .cn-roster-team{margin-bottom:10px;}
  .cn-roster-team .team-label{font-weight:800;font-family:'Baloo 2',cursive;font-size:14px;margin-bottom:4px;}
  .cn-roster-team.red .team-label{color:var(--red);}
  .cn-roster-team.blue .team-label{color:var(--blue);}
  .cn-turn-banner{
    text-align:center;
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:18px;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
  }
  .cn-turn-banner.red{background:rgba(255,94,91,0.18);color:var(--red);}
  .cn-turn-banner.blue{background:rgba(62,198,240,0.18);color:var(--blue);}
  .cn-board{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:6px;
    margin:10px 0;
  }
  .cn-tile{
    aspect-ratio:1.3;
    border-radius:8px;
    border:2px solid var(--line);
    background:#241a44;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:10px;
    font-weight:700;
    color:var(--paper);
    padding:2px;
    cursor:pointer;
    word-break:break-word;
  }
  .cn-tile.revealed.red{background:var(--red);color:var(--ink);border-color:var(--red);}
  .cn-tile.revealed.blue{background:var(--blue);color:var(--ink);border-color:var(--blue);}
  .cn-tile.revealed.neutral{background:#B9AEDD;color:var(--ink);border-color:#B9AEDD;}
  .cn-tile.revealed.assassin{background:#0a0612;color:var(--red);border-color:var(--red);}
  .cn-tile.spy-red:not(.revealed){box-shadow:inset 0 0 0 3px var(--red);}
  .cn-tile.spy-blue:not(.revealed){box-shadow:inset 0 0 0 3px var(--blue);}
  .cn-tile.spy-assassin:not(.revealed){box-shadow:inset 0 0 0 3px #000;}
  .cn-tile.not-clickable{cursor:default;}
  .cn-clue-display{
    text-align:center;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    border:3px solid var(--ink);
    padding:10px;
    margin-bottom:10px;
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:18px;
  }

  /* ---- Monopoly ---- */
  .mp-page{ /* deliberately no border/background/shadow — the board should use the space, not sit in a box */
    margin:0;
  }
  .mp-board-wrap{
    width:100%;
    aspect-ratio:1;
    overflow:hidden;
    margin-bottom:10px;
    border:3px solid var(--ink);
    border-radius:14px;
    background:#EAF4FF;
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
  }
  @media (min-width:900px){
    body.mp-wide .mp-board-wrap{
      width:auto;
      height:100%;
      max-width:100%;
      margin-bottom:0;
    }
  }
  .mp-board{
    display:grid;
    /* outer ring gets bigger tracks (fits full words), the 9 inner tracks
       shrink slightly to compensate — same total board size, bigger tiles */
    grid-template-columns:1.3fr repeat(9, 0.933fr) 1.3fr;
    grid-template-rows:1.3fr repeat(9, 0.933fr) 1.3fr;
    width:100%;
    height:100%;
    background:#EAF4FF;
  }
  .mp-space{
    border:1px solid #CFE3F5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:3px;
    font-size:clamp(6px, min(1.4vw, 1.7vh), 15px);
    color:var(--ink);
    position:relative;
    overflow:hidden;
    background:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.6);
    cursor:pointer;
  }
  .mp-space .mp-color-bar{position:absolute;background:#888;}
  /* colour bar orientation flips per side, so every bar points at the centre logo */
  .mp-space.side-bottom .mp-color-bar{top:0;left:0;right:0;height:9px;}
  .mp-space.side-bottom{padding-top:11px;}
  .mp-space.side-top .mp-color-bar{bottom:0;left:0;right:0;height:9px;}
  .mp-space.side-top{padding-bottom:11px;}
  .mp-space.side-left .mp-color-bar{top:0;bottom:0;right:0;width:9px;}
  .mp-space.side-left{padding-right:11px;}
  .mp-space.side-right .mp-color-bar{top:0;bottom:0;left:0;width:9px;}
  .mp-space.side-right{padding-left:11px;}
  .mp-space .mp-name{
    font-weight:700;text-align:center;line-height:1.15;
    font-size:clamp(4.5px, min(1.5vw, 1.8vh), 16px);
    overflow-wrap:normal;word-break:normal;hyphens:none;
    white-space:normal;
    max-width:100%;
    padding:0 1px;
  }
  .mp-space .mp-icon{width:clamp(11px, min(2.2vw, 2.6vh), 22px);height:clamp(11px, min(2.2vw, 2.6vh), 22px);margin-bottom:1px;}
  .mp-space .mp-icon svg{width:100%;height:100%;display:block;}
  .mp-space .mp-owner-dot{width:9px;height:9px;border-radius:50%;position:absolute;top:3px;right:3px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.3);}
  .mp-space .mp-houses{

  function pickPictionaryWords(n, used){
    const avail = PICTIONARY_WORDS.filter(w=>!(used||[]).includes(w));

  // A tiny seeded shuffle so every client reveals hint letters in the SAME
  // order without needing to store that order anywhere — the round id is
  // the seed, so it's identical and reproducible on every device.
  function seededShuffleIndices(count, seedStr){
    let seed = 0;
    for(let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
    function rand(){ seed = (seed*1103515245 + 12345) >>> 0; return seed / 4294967296; }
    const idx = Array.from({length:count}, (_,i)=>i);
    for(let i=idx.length-1;i>0;i--){
      const j = Math.floor(rand()*(i+1));
      [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    return idx;
  }
  function maskedWordDisplay(word, elapsedFraction, roundId){
    const letterPositions = [];
    for(let i=0;i<word.length;i++) if(word[i]!==' ') letterPositions.push(i);
    const order = seededShuffleIndices(letterPositions.length, roundId);
    // never reveal every letter via hints alone — always leave at least one
    const maxReveal = Math.max(0, letterPositions.length - 1);
    const revealCount = Math.min(maxReveal, Math.floor(elapsedFraction * letterPositions.length));
    const revealedPositions = new Set(order.slice(0, revealCount).map(oi=>letterPositions[oi]));
    let out = '';
    for(let i=0;i<word.length;i++){
      if(word[i]===' ') out += '  ';
      else out += (revealedPositions.has(i) ? word[i].toUpperCase() : '_') + ' ';
    }
    return out.trim();
  }

  // ---- Chain round ----
  function myChainTask(){
    const N = meta.N, phase = meta.phaseIndex;
    const myIndex = meta.chainOrder.indexOf(myId);
    const ownerIndex = ((myIndex - phase) % N + N) % N;
    const ownerId = meta.chainOrder[ownerIndex];
    const ownerName = ui.players.find(p=>p.id===ownerId)?.name || '???';
    let kind;
    if(phase===0) kind='write';
    else if(phase%2===1) kind='draw';
    else kind='guess';
    return {ownerId, ownerName, kind};
  }

  // ---------- shared phase timer (countdown + auto-skip) ----------
  // Ticks locally every half-second from a shared meta.phaseStartedAt
  // timestamp, so it doesn't need its own network round-trip. The actual
  // auto-skip decision is made by the host inside refreshAndRender, reusing
  // the same "advance" functions the manual skip buttons already call.
  let timerTickId = null;
  function stopTimerTicker(){ if(timerTickId){ clearInterval(timerTickId); timerTickId=null; } }
  function startTimerTicker(){
    stopTimerTicker();
    updateTimerDisplay();
    timerTickId = setInterval(updateTimerDisplay, 500);
  }
  function updateTimerDisplay(){
    const el = document.getElementById('phaseTimer');
    if(!el || !meta || !meta.phaseStartedAt) return;
    const elapsed = (Date.now() - meta.phaseStartedAt) / 1000;
    const remaining = Math.ceil((meta.phaseDurationSec || 60) - elapsed);
    if(remaining > 0){
      el.textContent = `⏱ ${remaining}s`;
      el.classList.toggle('urgent', remaining <= 10);
    } else {
      el.textContent = `Time's up — waiting up to ${AUTO_SKIP_GRACE_SEC}s for stragglers…`;
      el.classList.add('urgent');
    }
    // Stage Draw: update the masked word smoothly as hints reveal, rather
    // than only on the slower ~1.8s network poll
    if(meta.status==='pict_draw' && myId!==meta.pictDrawerId && meta.pictChosenWord){
      const maskedEl = document.getElementById('maskedWord');
      if(maskedEl){
        const fraction = Math.min(1, elapsed / (meta.phaseDurationSec||60));
        maskedEl.textContent = maskedWordDisplay(meta.pictChosenWord, fraction, meta.pictRoundId);
      }
    }
  }
  function phaseTimerHtml(){ return `<div class="phase-timer" id="phaseTimer"></div>`; }
  const VOTE_GRACE_SEC = 5; // votes are quick taps — no need for a long stragglers window
  function isPastDeadline(graceSec){
    if(!meta || !meta.phaseStartedAt) return false;
    const elapsed = (Date.now() - meta.phaseStartedAt) / 1000;
    const grace = (graceSec===undefined) ? AUTO_SKIP_GRACE_SEC : graceSec;
    return elapsed > (meta.phaseDurationSec || 60) + grace;
  }

  function rosterRowHtml(){
    if(!ui.players || !ui.players.length) return '';
    return `<div class="roster-row">${ui.players.map(p=>`
      <div class="roster-chip" title="${escapeHtml(p.name)}">
        ${p.character ? `<img src="${charById(p.character).file}" alt="${escapeHtml(p.name)}" />` : escapeHtml(p.name.slice(0,2).toUpperCase())}
      </div>
    `).join('')}</div>`;
  }

    }

    // for draw/guess we need the previous content
    const prev = ui.chainTaskCache;
    if(task.kind==='draw'){
      const prevText = prev && prev.type==='text' ? prev.content : '…';
      return `
        <div class="panel">

              </div>

            <div class="tool-row">
              <span class="tool-label">Pen</span>
              ${PEN_SIZES.map(sz=>`
                <div class="pen-size-btn ${(!isEraser && sz===currentSize)?'active':''}" data-size="${sz}" title="${sz}px">
                  <div class="dot" style="width:${Math.max(4,sz*0.8)}px;height:${Math.max(4,sz*0.8)}px;"></div>
                </div>
              `).join('')}
              <span class="tool-label" style="margin-left:6px;">Tools</span>
              <div class="tool-btn ${isEraser?'active':''}" id="eraserBtn" title="Eraser">🧹</div>
              <div class="tool-btn" id="undoBtn" title="Undo">↶</div>
              <div class="tool-btn" id="redoBtn" title="Redo">↷</div>
              <button class="btn small ghost" id="clearBoardBtn" style="margin-left:auto;">Clear</button>
            </div>
          </div>
          <div class="submit-row"><button class="btn mint compact" id="submitDrawingBtn">Submit drawing</button></div>
        </div>

    // guess
    const prevImg = prev && prev.type==='drawing' ? prev.content : '';
    return `
      <div class="panel">

        <div class="submit-row"><button class="btn mint compact" id="submitGuessBtn">Submit guess</button></div>

  function hslToHex(h,s,l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  function updateCurrentColor(){
    currentColor = hslToHex(currentHue, currentSat, currentLight);
    const sw = document.getElementById('currentColorSwatch');
    if(sw) sw.style.background = currentColor;
  }

  function positionWheelPuck(){
    const wheel = document.getElementById('colorWheel');
    const puck = document.getElementById('wheelPuck');
    if(!wheel || !puck) return;
    const r = wheel.clientWidth/2;
    const dist = (currentSat/100) * r;
    const rad = (currentHue - 90) * Math.PI/180;
    puck.style.left = (r + dist*Math.cos(rad)) + 'px';
    puck.style.top = (r + dist*Math.sin(rad)) + 'px';
    puck.style.background = currentColor;
  }

  function pushUndoSnapshot(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !canvasCtx) return;
    try{
      undoStack.push(canvasCtx.getImageData(0,0,canvas.width,canvas.height));
      if(undoStack.length > 25) undoStack.shift();
      redoStack = [];
      updateUndoRedoButtons();
    }catch(e){}
  }
  function updateUndoRedoButtons(){
    const u = document.getElementById('undoBtn');
    const r = document.getElementById('redoBtn');
    if(u) u.style.opacity = undoStack.length>1 ? '1' : '0.3';
    if(r) r.style.opacity = redoStack.length>0 ? '1' : '0.3';
  }
  function doUndo(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !canvasCtx || undoStack.length<=1) return;
    const current = undoStack.pop();
    redoStack.push(current);
    canvasCtx.putImageData(undoStack[undoStack.length-1], 0, 0);
    updateUndoRedoButtons();
  }
  function doRedo(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !canvasCtx || !redoStack.length) return;
    const next = redoStack.pop();
    undoStack.push(next);
    canvasCtx.putImageData(next, 0, 0);
    updateUndoRedoButtons();
  }

  function setupCanvasIfNeeded(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas) return;
    if(canvasCtx && canvas.dataset.wired==='1') return; // already set up for this task — don't reset the drawing
    canvas.width = canvas.clientWidth * 2;
    canvas.height = canvas.clientHeight * 2;
    const ctx2d = canvas.getContext('2d');
    ctx2d.fillStyle = '#fff';
    ctx2d.fillRect(0,0,canvas.width,canvas.height);
    ctx2d.lineJoin='round'; ctx2d.lineCap='round';
    canvasCtx = ctx2d;
    canvas.dataset.wired = '1';

    // fresh tool state for each new drawing task
    currentHue=252; currentSat=45; currentLight=22; currentSize=8; isEraser=false;
    updateCurrentColor();
    positionWheelPuck();
    // the HTML for the pen/eraser buttons was built with the *previous* task's
    // settings, so sync their active classes to the freshly-reset state
    document.querySelectorAll('.pen-size-btn').forEach(b=>{
      b.classList.toggle('active', parseInt(b.getAttribute('data-size'),10)===currentSize);
    });
    const eraserBtnEl = document.getElementById('eraserBtn');
    if(eraserBtnEl) eraserBtnEl.classList.remove('active');
    const lightSlider = document.getElementById('lightnessSlider');
    if(lightSlider) lightSlider.value = currentLight;
    undoStack=[]; redoStack=[];
    pushUndoSnapshot(); // blank canvas as the first undo state

    let last=null;
    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
      return { x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height) };
    }
    function start(e){ drawing=true; last=posFromEvent(e); e.preventDefault(); }
    function move(e){
      if(!drawing) return;
      const p = posFromEvent(e);
      ctx2d.strokeStyle = isEraser ? '#ffffff' : currentColor;
      ctx2d.lineWidth = (isEraser ? currentSize*2.2 : currentSize) * 2; // *2 to match the 2x canvas backing resolution
      ctx2d.beginPath(); ctx2d.moveTo(last.x,last.y); ctx2d.lineTo(p.x,p.y); ctx2d.stroke();
      last = p; e.preventDefault();
    }
    function end(){
      if(drawing) pushUndoSnapshot();
      drawing=false;
    }
    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);

    // ---- color wheel ----
    const wheel = document.getElementById('colorWheel');
    if(wheel){
      let picking=false;
      function pickFromEvent(e){
        const rect = wheel.getBoundingClientRect();
        const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left - rect.width/2;
        const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top - rect.height/2;
        let dist = Math.sqrt(cx*cx + cy*cy) / (rect.width/2);
        dist = Math.min(1, dist);
        let angle = Math.atan2(cy, cx) * 180/Math.PI + 90;
        if(angle < 0) angle += 360;
        currentHue = angle;
        currentSat = Math.round(dist*100);
        updateCurrentColor();
        positionWheelPuck();
      }
      function wheelStart(e){ picking=true; pickFromEvent(e); e.preventDefault(); }
      function wheelMove(e){ if(!picking) return; pickFromEvent(e); e.preventDefault(); }
      function wheelEnd(){ picking=false; }
      wheel.addEventListener('mousedown',wheelStart); wheel.addEventListener('mousemove',wheelMove); window.addEventListener('mouseup',wheelEnd);
      wheel.addEventListener('touchstart',wheelStart,{passive:false}); wheel.addEventListener('touchmove',wheelMove,{passive:false}); wheel.addEventListener('touchend',wheelEnd);
    }
  }

  // ---- Chain reveal ----

  // ---- Stage Draw: drawing + guessing ----
  function pictDrawHtml(){
    const isDrawer = myId === meta.pictDrawerId;
    if(isDrawer){
      return `
        <div class="panel">
          <h2 class="display" style="font-size:19px;">You're drawing: ${escapeHtml(meta.pictChosenWord.toUpperCase())}</h2>

          <p class="lede">Everyone else can see this canvas update every couple seconds. Keep drawing until time's up or everyone guesses it!</p>

    return `
      <div class="panel">
        <div class="cn-turn-banner ${meta.cnTurnTeam}">${meta.cnTurnTeam==='red'?'🔴':'🔵'} ${meta.cnTurnTeam==='red'?'Red':'Blue'} team's turn — ${meta.cnPhase==='clue' ? 'giving a clue' : 'guessing'}</div>

        <p class="muted center">🔴 Red: ${redLeft} left &nbsp;&nbsp; 🔵 Blue: ${blueLeft} left</p>
        ${meta.cnClue ? `<div class="cn-clue-display">"${escapeHtml(meta.cnClue.word)}" — ${meta.cnClue.number}<div class="muted" style="font-family:'Inter',sans-serif;font-weight:400;font-size:12px;margin-top:4px;">${(meta.cnGuessesAllowed||0)-(meta.cnGuessesUsed||0)} guess(es) left this turn</div></div>` : ''}
        <div class="cn-board">
          ${board.map((t,i)=>{
            const spyClass = (!t.revealed && caller) ? (t.color==='assassin' ? 'spy-assassin' : `spy-${t.color}`) : '';
            const clickable = isMyTurn && !caller && meta.cnPhase==='guess' && !t.revealed;

  function monopolyPlayHtml(){
    const pid = mpCurrentPid();
    const isMyTurn = mpIsMyTurn();
    const phase = meta.mpPhase;
    const myBalance = meta.mpBalances[myId];
    const myProps = Object.keys(meta.mpOwnership).map(Number).filter(i=>meta.mpOwnership[i].owner===myId);

    const boardHtml = MONOPOLY_BOARD.map((space,i)=>{
      const pos = mpGridPos(i);
      const own = meta.mpOwnership[i];
      const side = mpTileSide(i);
      const colorBar = space.group ? `<div class="mp-color-bar" style="background:${MONOPOLY_GROUP_COLORS[space.group]};"></div>` : '';
      const ownerDot = own ? `<div class="mp-owner-dot" style="background:${MONOPOLY_GROUP_COLORS[space.group]||'#888'};opacity:${own.mortgaged?0.3:1};"></div>` : '';
      const houses = own && own.houses>0
        ? `<div class="mp-houses">${own.houses===5 ? MP_HOTEL_SVG : MP_HOUSE_SVG.repeat(own.houses)}</div>`
        : '';
      const icon = mpSpaceIcon(space);
      const tokens = mpPlayersOn(i).map(p=>{
        const pl = ui.players.find(x=>x.id===p);
        return pl && pl.character ? `<img src="${charById(pl.character).file}" alt="" />` : '';

      return `<div class="mp-space ${side==='corner'?'mp-corner':'side-'+side}" data-mptile="${i}" style="grid-row:${pos.row};grid-column:${pos.col};">

        ${icon ? `<div class="mp-icon">${icon}</div>` : ''}
        <div class="mp-name">${escapeHtml(mpSpaceLabel(space))}</div>

    const centerHtml = `
      <div class="mp-center" id="mpCenterPanel">

        <div class="mp-dice-row" id="mpDiceRow">
          <div class="mp-die" id="mpDie1">${mpDieFaceHtml(meta.mpLastRoll?meta.mpLastRoll[0]:0)}</div>
          <div class="mp-die" id="mpDie2">${mpDieFaceHtml(meta.mpLastRoll?meta.mpLastRoll[1]:0)}</div>

        <p class="muted center" style="margin:0;">${escapeHtml(mpPlayerName(pid))}'s turn</p>

      <div class="mp-page">
        <div class="mp-layout">
          <div class="mp-board-col">
            <div class="mp-board-wrap"><div class="mp-board">${boardHtml}${centerHtml}</div></div>
          </div>

          <div class="mp-sidebar-col">
            ${phaseTimerHtml()}
            <div class="mp-turn-strip">
              ${(meta.mpOrder||[]).map(p=>{
                const pl = ui.players.find(x=>x.id===p);
                return `<div class="mp-player-chip ${p===pid?'turn':''} ${meta.mpBankrupt[p]?'bankrupt':''}" data-mpplayerinfo="${p}">
                  ${pl && pl.character ? `<img src="${charById(pl.character).file}" alt="" />` : ''}
                  <span class="mp-player-name">${pl?escapeHtml(pl.name):'???'}</span>
                  <span class="mp-balance">$${meta.mpBalances[p]}</span>
                </div>`;
              }).join('')}
            </div>

            ${meta.mpTradeOffer && meta.mpTradeOffer.toPid===myId ? monopolyIncomingTradeHtml() : ''}

            <label class="field-label">My properties (${myProps.length})</label>
            <div class="mp-deed-row-wrap">
              ${myProps.length ? myProps.map(i=>monopolyDeedCardHtml(i)).join('') : `<p class="muted">None yet.</p>`}
            </div>

  function monopolyMyTurnControlsHtml(myBalance){

      return `

        </div>
      `;
    }

          <button class="btn ghost" id="mpDeclineBuyBtn">Don't buy</button>
        </div>
      `;
    }

    }
    if(meta.mpPhase==='postroll'){
      return `<button class="btn red" id="mpEndTurnBtn">${meta.mpDoublesCount>0?'Roll again (doubles!) →':'End turn →'}</button>`;

  function monopolyDeedCardHtml(i){
    const space = MONOPOLY_BOARD[i];
    const own = meta.mpOwnership[i];
    const isMyTurn = mpIsMyTurn();
    const canBuild = isMyTurn && space.t==='property' && !own.mortgaged && own.houses<5 && mpOwnsFullGroup(myId, space.group, meta.mpOwnership);
    const canMortgageToggle = isMyTurn && own.houses===0;
    const lightGroups = ['lightblue','yellow'];
    const headerColor = space.group ? MONOPOLY_GROUP_COLORS[space.group] : '#3a3a5c';
    const darkText = space.group && lightGroups.includes(space.group);
    // houses 1-4 show as red squares (matches the reference drawing);
    // a hotel (5) shows as one gold bar instead of 5 tiny squares
    let housePips = '';
    if(own.houses===5) housePips = `<div class="mp-deed-hotel-pip" title="Hotel"></div>`;
    else if(own.houses>0) housePips = Array.from({length:own.houses}).map(()=>`<div class="mp-deed-house-pip"></div>`).join('');
    return `
      <div class="mp-deed ${own.mortgaged?'mortgaged':''}" data-mptile="${i}">
        <div class="mp-deed-header ${darkText?'dark-text':''}" style="background:${headerColor};">${escapeHtml(space.name)}</div>
        <div class="mp-deed-body">
          <div class="mp-deed-houses">${housePips}</div>
          <div class="mp-deed-actions-row">
            ${canBuild ? `<div class="mp-deed-icon-btn" data-mpbuild="${i}" title="Build a house ($${space.houseCost})">➕</div>` : ''}
            ${canMortgageToggle ? `<div class="mp-deed-icon-btn" data-mpmortgage="${i}" title="${own.mortgaged?'Unmortgage':'Mortgage'}">${own.mortgaged?'🔓':'🏦'}</div>` : ''}
          </div>
        </div>
      </div>
    `;
  }

    const theirProps = ui.mpTradeTarget ? Object.keys(meta.mpOwnership).map(Number).filter(i=>meta.mpOwnership[i].owner===ui.mpTradeTarget) : [];
    return `
      <div class="panel tight" style="margin-top:8px;">
        <label class="field-label">Trade with</label>
        <div class="duration-picker">
          ${others.map(p=>`<div class="duration-btn ${ui.mpTradeTarget===p?'active':''}" data-mptradetarget="${p}">${escapeHtml(mpPlayerName(p))}</div>`).join('')}
        </div>

              e.stopPropagation(); // don't also register this tap as selecting the vote

        on('nextModeFromSoundBtn','click', startModeVote);
        on('finishGameBtn','click', finishGame);

        on('viewChainsAgainBtn','click', async ()=>{ await loadReveal(); meta = Object.assign({}, meta, {status:'chain_reveal'}); render(); });
      }
    }

  async function createLobby(){

  async function finalizeModeVote(){
    const keys = await sListKeys(`lobby:${lobbyCode}:modevote:${meta.modeVoteId}:`);
    const votes = await Promise.all(keys.map(k=>sGet(k)));
    const total = meta.N || (ui.players ? ui.players.length : 0);
    const availableModes = MODES.filter(m=>!m.minPlayers || total>=m.minPlayers);
    const counts = {};
    availableModes.forEach(m=>counts[m.id]=0);
    let shuffleCount = 0;
    votes.forEach(v=>{
      if(!v) return;
      if(v.choice==='shuffle') shuffleCount++;
      else if(counts[v.choice]!==undefined) counts[v.choice]++;
    });
    const maxConcrete = Math.max(0, ...availableModes.map(m=>counts[m.id]));
    let chosenId;
    if(shuffleCount > maxConcrete || maxConcrete===0){
      chosenId = availableModes[Math.floor(Math.random()*availableModes.length)].id;
    } else {
      const leaders = availableModes.filter(m=>counts[m.id]===maxConcrete);
      chosenId = leaders[Math.floor(Math.random()*leaders.length)].id;
    }
    if(chosenId==='chain') await beginChainMode();
    else if(chosenId==='pictionary') await beginPictionaryMode();
    else if(chosenId==='impression') await beginImpressionMode();
    else if(chosenId==='codenames') await beginCodenamesMode();
    else if(chosenId==='monopoly') await beginMonopolyMode();
    else await beginSoundMode();
  }

  async function pushStageSnapshot(){
    const canvas = document.getElementById('drawBoard');
    if(!canvas || !meta || meta.status!=='pict_draw') return;
    try{
      // Downscale + JPEG before encoding — the live preview doesn't need
      // full resolution, and a small, fast-to-compress payload is what
      // makes rapid-fire updates over polling actually practical.
      const maxW = 360;
      const scale = Math.min(1, maxW / canvas.width);
      const small = document.createElement('canvas');
      small.width = Math.round(canvas.width * scale);
      small.height = Math.round(canvas.height * scale);
      const sctx = small.getContext('2d');
      sctx.fillStyle = '#fff'; sctx.fillRect(0,0,small.width,small.height); // JPEG has no alpha channel
      sctx.drawImage(canvas, 0, 0, small.width, small.height);
      const dataUrl = small.toDataURL('image/jpeg', 0.55);
      await sSet(`lobby:${lobbyCode}:pictcanvas:${meta.pictRoundId}`, { img: dataUrl });
    }catch(e){}
  }
  // Self-scheduling instead of a fixed setInterval: each push waits for the
  // last one to fully finish before starting the next, so on a fast
  // connection it fires back-to-back as quickly as the network allows,
  // and on a slow connection it never piles up overlapping requests.
  let pictSnapshotTimeoutId = null;
  function stopStageSnapshotLoop(){ if(pictSnapshotTimeoutId){ clearTimeout(pictSnapshotTimeoutId); pictSnapshotTimeoutId=null; } }
  function startStageSnapshotLoop(){
    stopStageSnapshotLoop();
    const tick = async ()=>{
      if(!meta || meta.status!=='pict_draw') return; // round ended — stop naturally
      await pushStageSnapshot();
      pictSnapshotTimeoutId = setTimeout(tick, 80);
    };
    tick();
  }

  async function computePictResultsSummary(){

    return {
      correctGuessers,
      everyoneGotIt,
      display: {
        word: meta.pictChosenWord,
        drawerName: meta.pictDrawerName,

    };

  async function toggleImpressionRecording(){
    if(ui.recording){
      if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
      ui.recording=false; render();
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
      if(ctx().state==='suspended'){ try{ await ctx().resume(); }catch(e){} }
      mediaChunks=[];
      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) mediaChunks.push(e.data); };
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(mediaChunks, {type: mediaChunks[0]?.type || 'audio/webm'});
        ui.imprRecordedBlob = blob;
        ui.imprRecordedUrl = URL.createObjectURL(blob);
        if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
        render();
      };
      mediaRecorder.start();
      ui.recording=true;
      render();
      setTimeout(()=>{ if(ui.recording && mediaRecorder && mediaRecorder.state!=='inactive'){ mediaRecorder.stop(); ui.recording=false; } }, 8000);
    }catch(e){
      ui.imprMicDenied = true; render();
    }
  }

  // Guards against restarting the same clip or double-firing 'ended' when
  // wireEvents runs again for a status that hasn't actually changed index.
  let imprLastPlayedIndex = -1;
  async function playCurrentImpressionClip(){
    const idx = meta.imprPlaybackIndex || 0;
    if(idx === imprLastPlayedIndex) return;
    imprLastPlayedIndex = idx;
    const order = meta.imprOrder || [];
    const pid = order[idx];
    if(!pid) return;
    const rec = await sGet(`lobby:${lobbyCode}:imprsound:${meta.imprRoundId}:${pid}`);
    const audioEl = document.getElementById('imprPlaybackAudio');
    if(!rec || !rec.audio || !audioEl) return;
    audioEl.src = rec.audio;
    audioEl.onended = () => { advanceImpressionPlayback(); };
    audioEl.play().catch(()=>{
      // if autoplay gets blocked, don't let the whole game stall — move on
      // after a short wait instead of waiting forever for a click
      setTimeout(()=>{ if(imprLastPlayedIndex===idx) advanceImpressionPlayback(); }, 4000);
    });
  }

  function generateCodenamesBoard(){
    const words = CODENAMES_WORDS.slice().sort(()=>Math.random()-0.5).slice(0,25);
    const startTeam = Math.random()<0.5 ? 'red' : 'blue';
    const otherTeam = startTeam==='red' ? 'blue' : 'red';
    const colors = [];
    for(let i=0;i<9;i++) colors.push(startTeam);
    for(let i=0;i<8;i++) colors.push(otherTeam);
    for(let i=0;i<7;i++) colors.push('neutral');
    colors.push('assassin');
    colors.sort(()=>Math.random()-0.5);
    return { board: words.map((w,i)=>({ word:w, color:colors[i], revealed:false })), startTeam };
  }

  // Called once setup finishes (everyone picked, or time ran out). Fills in
  // anyone missing a pick and guarantees each team has at least one caller
  // and one guesser, so the game is always actually playable.
  async function finalizeCodenamesSetup(){
    const players = ui.players.length ? ui.players : await fetchPlayers();
    const cnTeams = Object.assign({}, meta.cnTeams);
    const cnRoles = Object.assign({}, meta.cnRoles);
    const redCount = players.filter(p=>cnTeams[p.id]==='red').length;
    const blueCount = players.filter(p=>cnTeams[p.id]==='blue').length;
    let counts = { red: redCount, blue: blueCount };
    players.forEach(p=>{
      if(!cnTeams[p.id]){
        const team = counts.red<=counts.blue ? 'red' : 'blue';
        cnTeams[p.id] = team;
        counts[team]++;
      }
      if(!cnRoles[p.id]) cnRoles[p.id] = 'guesser';
    });
    // safety net: if everyone ended up on one team (e.g. everyone picked the
    // same side), split evenly instead of leaving a team with zero players —
    // otherwise the game would be unplayable
    if(counts.red===0 || counts.blue===0){
      const shuffled = players.slice().sort(()=>Math.random()-0.5);
      shuffled.forEach((p,i)=>{ cnTeams[p.id] = i%2===0 ? 'red' : 'blue'; });
    }
    ['red','blue'].forEach(team=>{
      const teamPlayers = players.filter(p=>cnTeams[p.id]===team);
      if(teamPlayers.length===0) return; // shouldn't happen once minPlayers is enforced
      const hasCaller = teamPlayers.some(p=>cnRoles[p.id]==='caller');
      if(!hasCaller) cnRoles[teamPlayers[0].id] = 'caller';
    });
    const { board, startTeam } = generateCodenamesBoard();
    const newMeta = Object.assign({}, meta, {
      status:'codenames_play',
      cnTeams, cnRoles, cnBoard: board,
      cnTurnTeam: startTeam, cnPhase:'clue',
      cnClue: null, cnGuessesUsed:0, cnGuessesAllowed:0,
      cnWinner:null, cnLossReason:null,
      phaseStartedAt: Date.now(),
      phaseDurationSec: meta.roundDurationSec || 60
    });
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    render();
  }

  function myCnTeam(){ return (meta.cnTeams||{})[myId] || null; }
  function myCnRole(){ return (meta.cnRoles||{})[myId] || null; }
  function isCnCaller(){ return myCnRole()==='caller'; }

  async function submitCodenamesClue(){
    const word = ui.cnClueWord.trim();
    const num = Math.max(0, parseInt(ui.cnClueNumber,10)||0);
    if(!word) return;
    const newMeta = Object.assign({}, meta, {
      cnPhase:'guess',
      cnClue: { word, number:num },
      cnGuessesUsed:0,
      cnGuessesAllowed: num+1,
      phaseStartedAt: Date.now(),
      phaseDurationSec: meta.roundDurationSec || 60
    });
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    ui.cnClueWord=''; ui.cnClueNumber=1;
    render();
  }

  function otherCnTeam(team){ return team==='red' ? 'blue' : 'red'; }

  async function passCodenamesTurn(){
    const newMeta = Object.assign({}, meta, {
      cnTurnTeam: otherCnTeam(meta.cnTurnTeam),
      cnPhase:'clue', cnClue:null, cnGuessesUsed:0, cnGuessesAllowed:0,
      phaseStartedAt: Date.now(),
      phaseDurationSec: meta.roundDurationSec || 60
    });
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    render();
  }

  async function guessCodenamesTile(index){
    const board = (meta.cnBoard||[]).slice();
    const tile = board[index];
    if(!tile || tile.revealed) return;
    tile.revealed = true;
    board[index] = tile;

    if(tile.color==='assassin'){
      const newMeta = Object.assign({}, meta, {
        status:'codenames_results', cnBoard: board,
        cnWinner: otherCnTeam(meta.cnTurnTeam), cnLossReason:'assassin'
      });
      await sSet(metaKey(), newMeta);
      meta = newMeta;
      await awardCodenamesWin(meta.cnWinner);
      render();
      return;
    }

    const myTeam = meta.cnTurnTeam;
    const remaining = board.filter(t=>!t.revealed && t.color===myTeam).length;
    if(remaining===0){
      const newMeta = Object.assign({}, meta, {
        status:'codenames_results', cnBoard: board, cnWinner: myTeam, cnLossReason:null
      });
      await sSet(metaKey(), newMeta);
      meta = newMeta;
      await awardCodenamesWin(myTeam);
      render();
      return;
    }

    if(tile.color!==myTeam){
      // wrong team's word or neutral — turn ends immediately
      const newMeta = Object.assign({}, meta, {
        cnBoard: board,
        cnTurnTeam: otherCnTeam(myTeam), cnPhase:'clue', cnClue:null, cnGuessesUsed:0, cnGuessesAllowed:0,
        phaseStartedAt: Date.now(), phaseDurationSec: meta.roundDurationSec || 60
      });
      await sSet(metaKey(), newMeta);
      meta = newMeta;
      render();
      return;
    }

    // correct guess — keep going if guesses remain
    const guessesUsed = (meta.cnGuessesUsed||0) + 1;
    if(guessesUsed >= (meta.cnGuessesAllowed||1)){
      const newMeta = Object.assign({}, meta, {
        cnBoard: board,
        cnTurnTeam: otherCnTeam(myTeam), cnPhase:'clue', cnClue:null, cnGuessesUsed:0, cnGuessesAllowed:0,
        phaseStartedAt: Date.now(), phaseDurationSec: meta.roundDurationSec || 60
      });
      await sSet(metaKey(), newMeta);
      meta = newMeta;
    } else {
      const newMeta = Object.assign({}, meta, { cnBoard: board, cnGuessesUsed: guessesUsed });
      await sSet(metaKey(), newMeta);
      meta = newMeta;
    }
    render();
  }

  async function awardCodenamesWin(winningTeam){
    const players = ui.players.length ? ui.players : await fetchPlayers();
    const winners = players.filter(p=>(meta.cnTeams||{})[p.id]===winningTeam);
    for(const w of winners){
      await addScore(w.id, w.name, 1);
    }
  }

  // ---------- actions: Monopoly ----------
  async function beginMonopolyMode(){
    const players = ui.players.length ? ui.players : await fetchPlayers();
    const order = players.map(p=>p.id).sort(()=>Math.random()-0.5);
    const positions = {}, balances = {}, inJail = {}, jailTurns = {}, gojfCards = {}, bankrupt = {};
    order.forEach(pid=>{ positions[pid]=0; balances[pid]=1500; inJail[pid]=false; jailTurns[pid]=0; gojfCards[pid]=0; bankrupt[pid]=false; });
    const newMeta = Object.assign({}, meta, {
      status:'monopoly_play',
      currentModeId:'monopoly',
      mpOrder: order,
      mpTurnIndex: 0,
      mpPositions: positions,
      mpBalances: balances,
      mpOwnership: {}, // spaceIndex -> {owner, houses, mortgaged}
      mpInJail: inJail,
      mpJailTurns: jailTurns,
      mpGojfCards: gojfCards,
      mpBankrupt: bankrupt,
      mpDoublesCount: 0,
      mpLastRoll: null,
      mpPhase: 'roll', // 'roll' | 'resolve' | 'postroll' | 'jail_choice'
      mpPendingBuy: null,
      mpPendingCard: null,
      mpPendingRent: null,
      mpLog: ['🎲 The game begins!'],
      mpTradeOffer: null,
      mpWinner: null,
      N: order.length,
      phaseStartedAt: Date.now(),
      phaseDurationSec: meta.roundDurationSec || 60
    });
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    view='game';
    render();
  }

  function mpCurrentPid(){ return (meta.mpOrder||[])[meta.mpTurnIndex||0]; }
  function mpIsMyTurn(){ return mpCurrentPid()===myId; }
  function mpLog(entry){
    const log = (meta.mpLog||[]).concat([entry]);
    return log.slice(-6); // keep it short — this is a live feed, not a full history
  }
  function mpPlayerName(pid){ const p=ui.players.find(pl=>pl.id===pid); return p?p.name:'???'; }

  // ---- dice pips (real dot patterns instead of digits) ----
  const MP_DIE_PIPS = { 0:[], 1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
  function mpDieFaceHtml(n){

  // ---- hover/tap info tooltip for tiles and players ----
  let _mpTooltipListenerAdded = false;
  function mpShowTooltip(html, anchorEl){
    let tip = document.getElementById('mpTooltip');
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'mpTooltip';
      tip.className = 'mp-tooltip';

    if(left < 10) left = 10;
    tip.style.left = left + 'px';
    tip.style.top = Math.max(10, r.top - 10) + 'px';
    tip.querySelector('.mp-tooltip-close').addEventListener('click', (e)=>{ e.stopPropagation(); mpHideTooltip(); });
    if(!_mpTooltipListenerAdded){
      document.addEventListener('click', mpHideTooltip);
      _mpTooltipListenerAdded = true;
    }

  function mpHideTooltip(){ const tip=document.getElementById('mpTooltip'); if(tip) tip.style.display='none'; }

  function mpPropertyTooltipHtml(i){
    const space = MONOPOLY_BOARD[i];
    const own = meta.mpOwnership[i];
    let html = `<strong>${escapeHtml(space.name)}</strong><br/>`;
    if(space.t==='property'){
      html += `Price: $${space.price}<br/>Rent: $${space.rent}<br/>`;
      space.houseRent.forEach((r,idx)=>{ html += `${idx<4?(idx+1)+' house':'Hotel'}: $${r}<br/>`; });
      html += `Mortgage value: $${space.mortgage}`;
    } else if(space.t==='railroad'){
      html += `Price: $${space.price}<br/>Rent scales with how many railroads the owner has (1: $25, 2: $50, 3: $100, 4: $200).`;
    } else if(space.t==='utility'){
      html += `Price: $${space.price}<br/>Rent = dice roll × 4 (one owned) or × 10 (both owned).`;
    } else if(space.t==='tax'){
      html += `Pay $${space.amount} to the bank.`;
    } else {
      html += space.t==='chance' ? 'Draw a Chance card.' : space.t==='chest' ? 'Draw a Community Chest card.' : 'Nothing happens here.';
    }
    if(space.t==='property' || space.t==='railroad' || space.t==='utility'){
      html += own
        ? `<br/><br/>Owner: ${escapeHtml(mpPlayerName(own.owner))}${own.mortgaged?' (mortgaged)':''}${own.houses>0?` — ${own.houses===5?'Hotel':own.houses+' house(s)'}`:''}`
        : `<br/><br/>Unowned`;
    }
    return html;
  }
  function mpPlayerTooltipHtml(pid){
    const props = Object.keys(meta.mpOwnership).map(Number).filter(i=>meta.mpOwnership[i].owner===pid);
    return `<strong>${escapeHtml(mpPlayerName(pid))}</strong><br/>Balance: $${meta.mpBalances[pid]}<br/>Properties: ${props.length ? props.map(i=>escapeHtml(MONOPOLY_BOARD[i].name)).join(', ') : 'None'}${meta.mpInJail[pid]?'<br/>🚔 In jail':''}${meta.mpBankrupt[pid]?'<br/>💥 Bankrupt':''}`;
  }

  function mpOwnsFullGroup(pid, group, ownership){
    const groupSpaces = MONOPOLY_BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===group);
    return groupSpaces.every(x=>ownership[x.i] && ownership[x.i].owner===pid);
  }

  function mpRentFor(spaceIndex, ownership, diceTotal){
    const space = MONOPOLY_BOARD[spaceIndex];
    const own = ownership[spaceIndex];
    if(!own || own.mortgaged) return 0;
    if(space.t==='railroad'){
      const ownedCount = MONOPOLY_BOARD.map((s,i)=>({s,i})).filter(x=>x.s.t==='railroad' && ownership[x.i] && ownership[x.i].owner===own.owner).length;
      return [0,25,50,100,200][ownedCount] || 0;
    }
    if(space.t==='utility'){
      const ownedCount = MONOPOLY_BOARD.map((s,i)=>({s,i})).filter(x=>x.s.t==='utility' && ownership[x.i] && ownership[x.i].owner===own.owner).length;
      return (ownedCount>=2 ? 10 : 4) * (diceTotal||7);
    }
    // regular property
    if(own.houses>0) return space.houseRent[own.houses-1];
    const fullSet = mpOwnsFullGroup(own.owner, space.group, ownership);
    return fullSet ? space.rent*2 : space.rent;
  }

  async function mpApplyMetaAndRender(patch, skipRender){
    const newMeta = Object.assign({}, meta, patch);
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    if(!skipRender) render();
  }

  async function mpRollDice(){
    if(!mpIsMyTurn() || meta.mpPhase!=='roll') return;
    const d1 = 1+Math.floor(Math.random()*6), d2 = 1+Math.floor(Math.random()*6);
    const isDoubles = d1===d2;
    const pid = mpCurrentPid();

    if(meta.mpInJail[pid]){
      // in jail: rolling doubles gets you out for free and you move that amount;
      // otherwise this counts as a failed attempt (3 fails = forced pay + move)
      const jailTurns = (meta.mpJailTurns[pid]||0) + 1;
      if(isDoubles){
        await mpMovePlayer(pid, d1+d2, { fromJail:true, roll:[d1,d2] });
      } else if(jailTurns>=3){
        const balances = Object.assign({}, meta.mpBalances);
        balances[pid] -= 50;
        const inJail = Object.assign({}, meta.mpInJail, {[pid]:false});
        await mpApplyMetaAndRender({ mpBalances:balances, mpInJail:inJail, mpJailTurns:Object.assign({},meta.mpJailTurns,{[pid]:0}), mpLastRoll:[d1,d2], mpLog: mpLog(`${mpPlayerName(pid)} paid $50 bail after 3 failed rolls.`) });
        await mpMovePlayer(pid, d1+d2, { roll:[d1,d2] });
        await mpCheckBankruptcy(pid);
      } else {
        await mpApplyMetaAndRender({ mpJailTurns:Object.assign({},meta.mpJailTurns,{[pid]:jailTurns}), mpLastRoll:[d1,d2], mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} rolled ${d1}+${d2}, still in jail.`) });
      }
      return;
    }

    const doublesCount = isDoubles ? (meta.mpDoublesCount||0)+1 : 0;
    if(isDoubles && doublesCount>=3){
      // 3 doubles in a row — go directly to jail
      const positions = Object.assign({}, meta.mpPositions, {[pid]:10});
      const inJail = Object.assign({}, meta.mpInJail, {[pid]:true});
      await mpApplyMetaAndRender({ mpPositions:positions, mpInJail:inJail, mpDoublesCount:0, mpLastRoll:[d1,d2], mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} rolled doubles 3 times — straight to jail!`) });
      return;
    }
    await mpApplyMetaAndRender({ mpDoublesCount:doublesCount, mpLastRoll:[d1,d2] });
    await mpMovePlayer(pid, d1+d2, { roll:[d1,d2], isDoubles });
  }

  async function mpMovePlayer(pid, spaces, opts){
    opts = opts || {};
    playMonopolySfx('move');
    const oldPos = meta.mpPositions[pid];
    let newPos = (oldPos + spaces) % 40;
    if(newPos < 0) newPos = (newPos + 40) % 40;
    const passedGo = !opts.fromJail && (oldPos + spaces) >= 40;
    const positions = Object.assign({}, meta.mpPositions, {[pid]:newPos});
    const balances = Object.assign({}, meta.mpBalances);
    let log = mpLog(`${mpPlayerName(pid)} moved to ${MONOPOLY_BOARD[newPos].name}${opts.roll?` (rolled ${opts.roll[0]}+${opts.roll[1]})`:''}.`);
    if(passedGo){
      balances[pid] += 200;
      log = mpLog(`${mpPlayerName(pid)} passed GO and collected $200.`);
      playMonopolySfx('passgo');
    }
    const inJail = opts.fromJail ? Object.assign({}, meta.mpInJail, {[pid]:false}) : meta.mpInJail;
    // write the real (final) state immediately for correctness/sync, but
    // hold off on the reveal-render — mpAnimateTokenMove walks the token
    // there step by step first, so it never just teleports
    await mpApplyMetaAndRender({ mpPositions:positions, mpBalances:balances, mpInJail:inJail, mpJailTurns: opts.fromJail?Object.assign({},meta.mpJailTurns,{[pid]:0}):meta.mpJailTurns, mpPhase:'resolve', mpLog:log }, true);
    await mpAnimateTokenMove(pid, oldPos, spaces);
    render();
    await mpResolveLanding(pid, newPos);
  }

  async function mpResolveLanding(pid, spaceIndex){
    const space = MONOPOLY_BOARD[spaceIndex];
    if(space.t==='go' || space.t==='jail' || space.t==='freeparking'){
      await mpApplyMetaAndRender({ mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
      return;
    }
    if(space.t==='gotojail'){
      const positions = Object.assign({}, meta.mpPositions, {[pid]:10});
      const inJail = Object.assign({}, meta.mpInJail, {[pid]:true});
      await mpApplyMetaAndRender({ mpPositions:positions, mpInJail:inJail, mpDoublesCount:0, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} was sent to jail!`) });
      return;
    }
    if(space.t==='tax'){
      const balances = Object.assign({}, meta.mpBalances);
      balances[pid] -= space.amount;
      await mpApplyMetaAndRender({ mpBalances:balances, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} paid $${space.amount} in tax.`) });
      await mpCheckBankruptcy(pid);
      return;
    }
    if(space.t==='chance' || space.t==='chest'){
      const deck = space.t==='chance' ? MONOPOLY_CHANCE : MONOPOLY_CHEST;
      const card = deck[Math.floor(Math.random()*deck.length)];
      await mpApplyMetaAndRender({ mpPendingCard: card, mpPhase:'resolve', mpLog: mpLog(`${mpPlayerName(pid)} drew a card: "${card.text}"`) });
      await mpApplyCard(pid, card);
      return;
    }
    // ownable space
    const own = meta.mpOwnership[spaceIndex];
    if(!own){
      await mpApplyMetaAndRender({ mpPendingBuy: spaceIndex, mpPhase:'resolve' });
      return;
    }
    if(own.owner===pid){
      await mpApplyMetaAndRender({ mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
      return;
    }
    if(own.mortgaged){
      await mpApplyMetaAndRender({ mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${space.name} is mortgaged — no rent due.`) });
      return;
    }
    const diceTotal = meta.mpLastRoll ? meta.mpLastRoll[0]+meta.mpLastRoll[1] : 7;
    const rent = mpRentFor(spaceIndex, meta.mpOwnership, diceTotal);
    const balances = Object.assign({}, meta.mpBalances);
    balances[pid] -= rent;
    balances[own.owner] = (balances[own.owner]||0) + rent;
    await mpApplyMetaAndRender({ mpBalances:balances, mpPendingRent:{to:own.owner, amount:rent}, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} paid $${rent} rent to ${mpPlayerName(own.owner)}.`) });
    await mpCheckBankruptcy(pid);
  }

  async function mpApplyCard(pid, card){
    const balances = Object.assign({}, meta.mpBalances);
    if(card.action==='collect'){
      balances[pid] += card.amount;
      await mpApplyMetaAndRender({ mpBalances:balances, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
    } else if(card.action==='pay'){
      balances[pid] -= card.amount;
      await mpApplyMetaAndRender({ mpBalances:balances, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
      await mpCheckBankruptcy(pid);
    } else if(card.action==='payeach'){
      (meta.mpOrder||[]).forEach(other=>{
        if(other===pid) return;
        balances[pid] -= card.amount;
        balances[other] = (balances[other]||0) + card.amount;
      });
      await mpApplyMetaAndRender({ mpBalances:balances, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
      await mpCheckBankruptcy(pid);
    } else if(card.action==='repairs'){
      let total = 0;
      Object.keys(meta.mpOwnership).forEach(idx=>{
        const o = meta.mpOwnership[idx];
        if(o.owner!==pid) return;
        if(o.houses>=1 && o.houses<=4) total += o.houses*card.house;
        if(o.houses===5) total += card.hotel;
      });
      balances[pid] -= total;
      await mpApplyMetaAndRender({ mpBalances:balances, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} paid $${total} in repairs.`) });
      await mpCheckBankruptcy(pid);
    } else if(card.action==='gojf'){
      const gojf = Object.assign({}, meta.mpGojfCards, {[pid]:(meta.mpGojfCards[pid]||0)+1});
      await mpApplyMetaAndRender({ mpGojfCards:gojf, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
    } else if(card.action==='gotojail'){
      const positions = Object.assign({}, meta.mpPositions, {[pid]:10});
      const inJail = Object.assign({}, meta.mpInJail, {[pid]:true});
      await mpApplyMetaAndRender({ mpPositions:positions, mpInJail:inJail, mpDoublesCount:0, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
    } else if(card.action==='move'){
      await mpMovePlayer(pid, card.by, {});
    } else if(card.action==='goto'){
      const oldPos = meta.mpPositions[pid];
      const forward = ((card.to - oldPos)+40)%40;
      await mpMovePlayer(pid, forward, {});
    } else if(card.action==='nearest'){
      const oldPos = meta.mpPositions[pid];
      const candidates = MONOPOLY_BOARD.map((s,i)=>i).filter(i=>MONOPOLY_BOARD[i].t===card.kind);
      let best = candidates[0];
      candidates.forEach(i=>{ if(((i-oldPos)+40)%40 < ((best-oldPos)+40)%40) best=i; });
      const forward = ((best-oldPos)+40)%40;
      await mpMovePlayer(pid, forward, {});
    } else {
      await mpApplyMetaAndRender({ mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
    }
  }

  async function mpBuyProperty(){
    if(!mpIsMyTurn() || meta.mpPendingBuy===null) return;
    const idx = meta.mpPendingBuy;
    const space = MONOPOLY_BOARD[idx];
    const pid = mpCurrentPid();
    const balances = Object.assign({}, meta.mpBalances);
    balances[pid] -= space.price;
    const ownership = Object.assign({}, meta.mpOwnership, { [idx]: { owner:pid, houses:0, mortgaged:false } });
    await mpApplyMetaAndRender({ mpBalances:balances, mpOwnership:ownership, mpPendingBuy:null, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10, mpLog: mpLog(`${mpPlayerName(pid)} bought ${space.name} for $${space.price}.`) });
    mpConfettiAtTile(idx);
  }
  async function mpDeclineBuy(){
    if(!mpIsMyTurn() || meta.mpPendingBuy===null) return;
    await mpApplyMetaAndRender({ mpPendingBuy:null, mpPhase:'postroll', phaseStartedAt:Date.now(), phaseDurationSec:10 });
  }

  async function mpBuildHouse(spaceIndex){
    if(!mpIsMyTurn()) return;
    const pid = mpCurrentPid();
    const own = meta.mpOwnership[spaceIndex];
    const space = MONOPOLY_BOARD[spaceIndex];
    if(!own || own.owner!==pid || own.mortgaged) return;
    if(!mpOwnsFullGroup(pid, space.group, meta.mpOwnership)) return;
    if(own.houses>=5) return;
    // even-building rule: can't build here more than 1 ahead of the lowest in the group
    const groupIdxs = MONOPOLY_BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===space.group).map(x=>x.i);
    const minHouses = Math.min(...groupIdxs.map(i=>(meta.mpOwnership[i]||{houses:0}).houses));
    if(own.houses > minHouses) return;
    if(meta.mpBalances[pid] < space.houseCost) return;
    const balances = Object.assign({}, meta.mpBalances);
    balances[pid] -= space.houseCost;
    const ownership = Object.assign({}, meta.mpOwnership, { [spaceIndex]: Object.assign({}, own, { houses: own.houses+1 }) });
    await mpApplyMetaAndRender({ mpBalances:balances, mpOwnership:ownership, mpLog: mpLog(`${mpPlayerName(pid)} built on ${space.name}.`) });
  }

  async function mpToggleMortgage(spaceIndex){
    if(!mpIsMyTurn()) return;
    const pid = mpCurrentPid();
    const own = meta.mpOwnership[spaceIndex];
    const space = MONOPOLY_BOARD[spaceIndex];
    if(!own || own.owner!==pid || own.houses>0) return;
    const balances = Object.assign({}, meta.mpBalances);
    let ownership;
    if(own.mortgaged){
      const cost = Math.ceil(space.mortgage*1.1);
      if(balances[pid] < cost) return;
      balances[pid] -= cost;
      ownership = Object.assign({}, meta.mpOwnership, { [spaceIndex]: Object.assign({}, own, { mortgaged:false }) });
    } else {
      balances[pid] += space.mortgage;
      ownership = Object.assign({}, meta.mpOwnership, { [spaceIndex]: Object.assign({}, own, { mortgaged:true }) });
    }
    await mpApplyMetaAndRender({ mpBalances:balances, mpOwnership:ownership });
  }

  async function mpCheckBankruptcy(pid){
    if(meta.mpBalances[pid] >= 0) return;
    // return all their properties to the bank and remove them from play
    const ownership = Object.assign({}, meta.mpOwnership);
    Object.keys(ownership).forEach(idx=>{
      if(ownership[idx].owner===pid) delete ownership[idx];
    });
    const bankrupt = Object.assign({}, meta.mpBankrupt, {[pid]:true});
    const remaining = (meta.mpOrder||[]).filter(p=>!bankrupt[p]);
    let patch = { mpOwnership:ownership, mpBankrupt:bankrupt, mpLog: mpLog(`💥 ${mpPlayerName(pid)} went bankrupt!`) };
    if(remaining.length<=1){
      patch.status='monopoly_results';
      patch.mpWinner = remaining[0]||null;
    }
    await mpApplyMetaAndRender(patch);
    if(patch.mpWinner) await addScore(patch.mpWinner, mpPlayerName(patch.mpWinner), 1);
  }

  async function mpEndTurn(){
    if(!mpIsMyTurn()) return;
    const pid = mpCurrentPid();
    if(meta.mpDoublesCount>0 && !meta.mpInJail[pid]){
      // rolled doubles — go again instead of passing the turn
      await mpApplyMetaAndRender({ mpPhase:'roll', mpPendingCard:null, mpPendingRent:null, phaseStartedAt:Date.now(), phaseDurationSec: meta.roundDurationSec||60 });
      return;
    }
    let nextIndex = (meta.mpTurnIndex+1) % meta.mpOrder.length;
    let guard = 0;
    while(meta.mpBankrupt[meta.mpOrder[nextIndex]] && guard<meta.mpOrder.length){ nextIndex=(nextIndex+1)%meta.mpOrder.length; guard++; }
    await mpApplyMetaAndRender({ mpTurnIndex:nextIndex, mpPhase:'roll', mpDoublesCount:0, mpPendingCard:null, mpPendingRent:null, phaseStartedAt:Date.now(), phaseDurationSec: meta.roundDurationSec||60 });
  }

  // Called by ANY client (not just the stalled player) once a turn's timer
  // plus grace period has fully elapsed — skips whatever they were mid-way
  // through rather than trying to guess their decision for them.
  async function mpForceEndTurn(){
    const stalledName = mpPlayerName(mpCurrentPid());
    let nextIndex = (meta.mpTurnIndex+1) % meta.mpOrder.length;
    let guard = 0;
    while(meta.mpBankrupt[meta.mpOrder[nextIndex]] && guard<meta.mpOrder.length){ nextIndex=(nextIndex+1)%meta.mpOrder.length; guard++; }
    await mpApplyMetaAndRender({
      mpTurnIndex:nextIndex, mpPhase:'roll', mpDoublesCount:0,
      mpPendingBuy:null, mpPendingCard:null, mpPendingRent:null,
      phaseStartedAt:Date.now(), phaseDurationSec: meta.roundDurationSec||60,
      mpLog: mpLog(`⏱ ${stalledName}'s turn timed out.`)
    });
  }

  async function mpPayJailBail(){
    if(!mpIsMyTurn() || !meta.mpInJail[mpCurrentPid()]) return;
    const pid = mpCurrentPid();
    if(meta.mpBalances[pid] < 50) return;
    const balances = Object.assign({}, meta.mpBalances);
    balances[pid] -= 50;
    const inJail = Object.assign({}, meta.mpInJail, {[pid]:false});
    await mpApplyMetaAndRender({ mpBalances:balances, mpInJail:inJail, mpJailTurns:Object.assign({},meta.mpJailTurns,{[pid]:0}), mpLog: mpLog(`${mpPlayerName(pid)} paid $50 bail.`) });

    const pid = mpCurrentPid();
    if(!(meta.mpGojfCards[pid]>0)) return;

  async function mpProposeTrade(toPid, offerProps, offerCash, requestProps, requestCash){

  async function mpRespondTrade(accept){
    const offer = meta.mpTradeOffer;
    if(!offer || offer.toPid!==myId) return;
    if(!accept){
      await mpApplyMetaAndRender({ mpTradeOffer:null, mpLog: mpLog('A trade offer was declined.') });
      return;
    }
    const balances = Object.assign({}, meta.mpBalances);
    const ownership = Object.assign({}, meta.mpOwnership);
    balances[offer.fromPid] = balances[offer.fromPid] - offer.offerCash + offer.requestCash;
    balances[offer.toPid] = balances[offer.toPid] - offer.requestCash + offer.offerCash;
    offer.offerProps.forEach(idx=>{ ownership[idx] = Object.assign({}, ownership[idx], {owner: offer.toPid}); });
    offer.requestProps.forEach(idx=>{ ownership[idx] = Object.assign({}, ownership[idx], {owner: offer.fromPid}); });
    await mpApplyMetaAndRender({ mpBalances:balances, mpOwnership:ownership, mpTradeOffer:null, mpLog: mpLog(`${mpPlayerName(offer.fromPid)} and ${mpPlayerName(offer.toPid)} completed a trade.`) });

  // ---- Monopoly board layout helper (11x11 grid, like the real board) ----
  function mpGridPos(i){
    if(i===0) return {row:11, col:11};
    if(i>=1 && i<=9) return {row:11, col:11-i};
    if(i===10) return {row:11, col:1};
    if(i>=11 && i<=19) return {row:11-(i-10), col:1};
    if(i===20) return {row:1, col:1};
    if(i>=21 && i<=29) return {row:1, col:1+(i-20)};
    if(i===30) return {row:1, col:11};
    return {row:1+(i-30), col:11}; // 31..39
  }
  // Which edge of the board a space sits on — used so each property's
  // colour bar faces INWARD toward the centre, not just always "up".
  function mpTileSide(i){
    if([0,10,20,30].includes(i)) return 'corner';
    const p = mpGridPos(i);
    if(p.row===11) return 'bottom'; // colour bar goes on top of the tile (facing up/in)
    if(p.row===1) return 'top';     // colour bar goes on bottom of the tile (facing down/in)
    if(p.col===1) return 'left';    // colour bar goes on right edge (facing right/in)
    return 'right';                 // colour bar goes on left edge (facing left/in)
  }

  // Measures the ACTUAL available space and sets the board's pixel size
  // directly, rather than relying on flex percentages (which reserve
  // layout space but don't guarantee a square aspect-ratio box grows to
  // fill it — that mismatch is exactly what left dead space before).
  function mpFitBoard(){
    const wrap = document.querySelector('.mp-board-wrap');
    if(!wrap) return;
    if(window.innerWidth < 900){
      wrap.style.width = ''; wrap.style.height = ''; // let mobile's normal 100%-width CSS handle it
      return;
    }
    const boardCol = document.querySelector('.mp-board-col');
    const layout = document.querySelector('.mp-layout');
    if(!boardCol || !layout) return;
    const layoutRect = layout.getBoundingClientRect();
    const colHeight = boardCol.getBoundingClientRect().height || layoutRect.height;
    const sidebarMinWidth = 260;
    const gap = 16; // must match .mp-layout's CSS gap
    const availableWidthForBoard = layoutRect.width - sidebarMinWidth - gap;
    const size = Math.max(300, Math.floor(Math.min(availableWidthForBoard, colHeight)));
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';
  }

  async function mpAnimateTokenMove(pid, fromPos, spaces){
    if(!spaces) return;
    const dir = spaces>0 ? 1 : -1;

      if(stepPos<0) stepPos += 40;

  // Tumbles the dice visually for a fixed stretch BEFORE calling the real
