  // ---------- waveform drawing (target sound vs. your own voice) ----------
  // These store the *entire history* of peak loudness over each clip's
  // duration (like a real audio-editor waveform), not just the current
  // instant — so the picture stays put after the sound finishes instead of
  // settling back to a flat line once the audio goes quiet.
  let targetEnvelope=[], liveEnvelope=[];
  let targetWaveAnimId=null, liveWaveAnimId=null;
  let _nextSoundDurationMs = 1700; // procedural presets use this default; file presets override it once decoded

  function sizeWaveCanvas(){
    const c = document.getElementById('waveCanvas');
    if(!c) return null;
    if(c.width !== c.clientWidth*2 || c.height !== c.clientHeight*2){
      c.width = c.clientWidth*2; c.height = c.clientHeight*2;
    }
    return c;
  }
  function resampleEnvelope(arr, n){
    if(!arr || !arr.length) return null;
    const out = new Array(n);
    for(let i=0;i<n;i++){
      out[i] = arr[Math.min(arr.length-1, Math.floor(i*arr.length/n))];
    }
    return out;
  }
  function drawEnvelopeBars(ctx2d, w, h, envelope, color, alpha){
    if(!envelope) return;
    const barCount = envelope.length;
    const gap = w / barCount;
    const barWidth = gap * 0.55;
    ctx2d.globalAlpha = alpha;
    ctx2d.fillStyle = color;
    for(let i=0;i<barCount;i++){
      const barHeight = Math.max(h*0.035, envelope[i] * h*0.92);
      const x = i*gap + (gap-barWidth)/2;
      const y = (h-barHeight)/2;
      ctx2d.fillRect(x, y, barWidth, barHeight);
    }
    ctx2d.globalAlpha = 1;
  }
  function renderWaveCanvas(){
    const c = sizeWaveCanvas();
    if(!c) return;
    const g = c.getContext('2d');
    g.clearRect(0,0,c.width,c.height);
    const BARS = 40;
    // faint baseline bars so the panel doesn't look empty before anything plays
    drawEnvelopeBars(g, c.width, c.height, new Array(BARS).fill(0), '#3a2e63', 1);
    drawEnvelopeBars(g, c.width, c.height, resampleEnvelope(targetEnvelope, BARS), '#8C7BFF', 0.9);
    drawEnvelopeBars(g, c.width, c.height, resampleEnvelope(liveEnvelope, BARS), '#FF5E5B', 0.8);
  }
  function resetWaveforms(){
    targetEnvelope=[]; liveEnvelope=[];
    if(targetWaveAnimId) cancelAnimationFrame(targetWaveAnimId);
    if(liveWaveAnimId) cancelAnimationFrame(liveWaveAnimId);
    targetWaveAnimId=null; liveWaveAnimId=null;
  }
  function peakOf(byteData){
    let maxDev = 0;
    for(let i=0;i<byteData.length;i++){
      const dev = Math.abs(byteData[i]/128 - 1);
      if(dev>maxDev) maxDev = dev;
    }
    return maxDev;
  }
  async function playTargetSound(def){
    if(ctx().state==='suspended'){ try{ await ctx().resume(); }catch(e){} }
    _nextSoundDurationMs = 1700; // reset to the procedural default; file sounds override this inside their own play()
    try{ await def.play(); }catch(e){ return; }
    if(targetWaveAnimId) cancelAnimationFrame(targetWaveAnimId);
    targetEnvelope = [];
    const analyser = targetAnalyser();
    const data = new Uint8Array(analyser.fftSize);
    const start = performance.now();
    const durationMs = _nextSoundDurationMs;
    function tick(){
      analyser.getByteTimeDomainData(data);
      targetEnvelope.push(peakOf(data));
      renderWaveCanvas();
      if(performance.now()-start < durationMs){ targetWaveAnimId = requestAnimationFrame(tick); }
    }
    tick();
  }

  async function toggleRecording(){
    if(ui.recording){
      if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
      ui.recording=false; render();
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
      if(ctx().state==='suspended'){ try{ await ctx().resume(); }catch(e){} }
      mediaChunks=[];
      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) mediaChunks.push(e.data); };
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(mediaChunks, {type: mediaChunks[0]?.type || 'audio/webm'});
        ui.recordedBlob = blob;
        ui.recordedUrl = URL.createObjectURL(blob);
        if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
        if(liveWaveAnimId){ cancelAnimationFrame(liveWaveAnimId); liveWaveAnimId=null; }
        render();
      };
      mediaRecorder.start();
      ui.recording=true;
      liveEnvelope = [];
      render();

      // draw the live mic waveform (analysis only — never routed to speakers,
      // or the player would hear their own voice echoed back)
      const micAnalyser = ctx().createAnalyser();
      micAnalyser.fftSize = 512;
      ctx().createMediaStreamSource(mediaStream).connect(micAnalyser);
      const micData = new Uint8Array(micAnalyser.fftSize);
      function micTick(){
        if(!ui.recording) return;
        micAnalyser.getByteTimeDomainData(micData);
        liveEnvelope.push(peakOf(micData));
        renderWaveCanvas();
        liveWaveAnimId = requestAnimationFrame(micTick);
      }
      micTick();

      setTimeout(()=>{ if(ui.recording && mediaRecorder && mediaRecorder.state!=='inactive'){ mediaRecorder.stop(); ui.recording=false; } }, 6000);
    }catch(e){
      ui.micDenied=true; render();
    }
  }

  function blobToBase64(blob){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function computeRoundTally(roundId){
    const entryKeys = await sListKeys(`lobby:${lobbyCode}:sound:${roundId}:`);
    const entries = await Promise.all(entryKeys.map(async k=>{
      const pid = k.split(':').pop();
      const v = await sGet(k);
      return {pid, name: v ? v.name : '???'};
    }));
    const voteKeys = await sListKeys(`lobby:${lobbyCode}:vote:${roundId}:`);
    const votes = await Promise.all(voteKeys.map(k=>sGet(k)));
    const counts = {};
    entries.forEach(e=>counts[e.pid]=0);
    votes.forEach(v=>{ if(v && counts[v.votedFor]!==undefined) counts[v.votedFor]++; });
    return entries.map(e=>({pid:e.pid, name:e.name, votes:counts[e.pid]||0})).sort((a,b)=>b.votes-a.votes);
  }

  async function awardRoundWinners(tally){
    if(!tally.length) return;
    const maxVotes = Math.max(...tally.map(r=>r.votes));
    if(maxVotes<=0) return; // nobody got any votes — no winner to award
    const winners = tally.filter(r=>r.votes===maxVotes);
    for(const w of winners){
      const key = `lobby:${lobbyCode}:score:${w.pid}`;
      const current = await sGet(key);
      const newScore = (current && typeof current.wins==='number' ? current.wins : 0) + 1;
      await sSet(key, { name: w.name, wins: newScore });
    }
  }

  async function computeFinalTally(){
    // final standings are based on rounds WON (from the persistent score
    // store awardRoundWinners/addScore write to), not raw vote totals —
    // include everyone who's ever joined, even if they haven't won a round.
    // Any client can compute this independently from shared storage — it
    // must NOT only live in the host's local memory, or nobody else ever
    // sees real standings once the status flips to 'final'.
    const allPlayers = ui.players && ui.players.length ? ui.players : await fetchPlayers();
    const scoreKeys = await sListKeys(`lobby:${lobbyCode}:score:`);
    const scores = await Promise.all(scoreKeys.map(k=>sGet(k)));
    const winsByPid = {};
    scoreKeys.forEach((k,i)=>{
      const pid = k.split(':').pop();
      winsByPid[pid] = scores[i] && typeof scores[i].wins==='number' ? scores[i].wins : 0;
    });
    return allPlayers
      .map(p=>({ pid:p.id, name:p.name, character:p.character, wins: winsByPid[p.id]||0 }))
      .sort((a,b)=>b.wins-a.wins);
  }

  async function finishGame(){
    ui.finalTally = await computeFinalTally();
    const newMeta = Object.assign({}, meta, {status:'final'});
    await sSet(metaKey(), newMeta);
    meta = newMeta;
    render();
  }

  // ---------- polling / sync ----------
  let lastStatusSeen = null;
  function mpSnapshotKey(m){
    return JSON.stringify([m.mpTurnIndex, m.mpPhase, m.mpPositions, m.mpBalances, m.mpOwnership, m.mpPendingBuy, m.mpPendingCard, m.mpTradeOffer, m.mpInJail, (m.mpLog||[]).length]);
  }
  async function refreshAndRender(){
    if(!lobbyCode) return;
    const freshMeta = await sGet(metaKey());
    if(!freshMeta){ return; }
    const oldRevealedCount = meta ? (meta.cnBoard||[]).filter(t=>t.revealed).length : -1;
    const newRevealedCount = (freshMeta.cnBoard||[]).filter(t=>t.revealed).length;
    const oldMpSnapshot = meta && meta.status==='monopoly_play' ? mpSnapshotKey(meta) : null;
    const newMpSnapshot = freshMeta.status==='monopoly_play' ? mpSnapshotKey(freshMeta) : null;
    const oldMpPositions = meta && meta.status==='monopoly_play' ? Object.assign({}, meta.mpPositions) : null;
    const statusChanged = !meta || meta.status!==freshMeta.status || meta.phaseIndex!==freshMeta.phaseIndex || meta.soundRoundId!==freshMeta.soundRoundId || meta.modeVoteId!==freshMeta.modeVoteId || meta.imprPlaybackIndex!==freshMeta.imprPlaybackIndex || meta.imprRoundId!==freshMeta.imprRoundId || meta.cnPhase!==freshMeta.cnPhase || meta.cnTurnTeam!==freshMeta.cnTurnTeam || meta.cnGuessesUsed!==freshMeta.cnGuessesUsed || oldRevealedCount!==newRevealedCount || oldMpSnapshot!==newMpSnapshot;
    meta = freshMeta;

    if(meta.status==='lobby'){
      ui.players = await fetchPlayers();
      render();
      return;
    }

    if(view==='lobby' && meta.status!=='lobby'){
      // host has started the game
      view='game';
      ui.players = await fetchPlayers();
    }

    if(meta.status==='mode_vote'){
      if(statusChanged){ ui.modeVoteSelected=null; ui.modeVoteSubmitted=false; }
      const mine = await sGet(`lobby:${lobbyCode}:modevote:${meta.modeVoteId}:${myId}`);
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.modeVoteSubmitted;
      ui.modeVoteSubmitted = submittedByMe;
      const total = meta.N || (ui.players ? ui.players.length : 0);
      const voteKeys = await sListKeys(`lobby:${lobbyCode}:modevote:${meta.modeVoteId}:`);
      ui.modeVoteProgress = {count: voteKeys.length, total};
      // Any connected client can trigger this once the deadline passes — not
      // just the host — so the game doesn't stall if the host's device sleeps
      // or their tab gets backgrounded (very common mid-party).
      if((isHost && voteKeys.length>=total) || isPastDeadline(VOTE_GRACE_SEC)){
        await finalizeModeVote();
        return;
      }
      if(statusChanged || submissionChanged || ui.modeVoteSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='chain'){
      if(statusChanged){ ui.chainSubmitted=false; ui.chainTaskCache=null; }
      const task = myChainTask();
      const mine = await sGet(chainKey(meta.phaseIndex, task.ownerId));
      // only count as "submitted" for me if the entry was written by me this phase
      const submittedByMe = !!(mine && mine.byPlayerId===myId);
      const submissionChanged = submittedByMe !== ui.chainSubmitted;
      ui.chainSubmitted = submittedByMe;
      if(task.kind!=='write' && !ui.chainTaskCache){
        ui.chainTaskCache = await sGet(chainKey(meta.phaseIndex-1, task.ownerId));
      }
      const progressKeys = await sListKeys(`lobby:${lobbyCode}:chain:${meta.phaseIndex}:`);
      ui.chainProgress = {count: progressKeys.length, total: meta.N};
      if((isHost && progressKeys.length>=meta.N) || isPastDeadline()){
        await advanceChainPhase();
        return;
      }
      // Only rebuild the DOM when something actually changed, or while waiting
      // (post-submit) so the progress bar updates. Never rebuild mid-task, or
      // an in-progress drawing on the canvas would get wiped by the redraw.
      if(statusChanged || submissionChanged || ui.chainSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='chain_reveal'){
      if(statusChanged || ui.revealChains.length===0) await loadReveal();
      render();
      return;
    }

    if(meta.status==='chain_vote'){
      if(statusChanged){ ui.chainVoteSelected=null; ui.chainVoteSubmitted=false; }
      if(ui.revealChains.length===0) await loadReveal(); // needed for the vote previews if we arrived here fresh
      const mine = await sGet(`lobby:${lobbyCode}:chainvote:${meta.modeVoteId}:${myId}`);
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.chainVoteSubmitted;
      ui.chainVoteSubmitted = submittedByMe;
      const voteKeys = await sListKeys(`lobby:${lobbyCode}:chainvote:${meta.modeVoteId}:`);
      ui.chainVoteProgress = {count: voteKeys.length, total: meta.N};
      if((isHost && voteKeys.length>=meta.N) || isPastDeadline(VOTE_GRACE_SEC)){
        await showChainVoteResults();
        return;
      }
      if(statusChanged || submissionChanged || ui.chainVoteSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='chain_vote_results'){
      if(ui.revealChains.length===0) await loadReveal();
      if(statusChanged || ui.chainVoteTally.length===0) ui.chainVoteTally = await computeChainVoteTally();
      render();
      return;
    }

    if(meta.status==='pict_choose'){
      if(statusChanged){ ui.pictGuessInput=''; ui.pictGuessedCorrectly=false; ui.pictFeed=[]; ui.pictResults=null; ui.pictStageImg=''; }
      if(isPastDeadline(VOTE_GRACE_SEC) && meta.status==='pict_choose'){
        await autoChooseWordIfNeeded();
        return;
      }
      if(statusChanged){ render(); }
      return;
    }

    if(meta.status==='pict_draw'){
      const isDrawer = myId === meta.pictDrawerId;
      if(statusChanged){ ui.pictGuessInput=''; ui.pictGuessedCorrectly=false; ui.pictFeed=[]; }
      if(!isDrawer){
        // targeted updates only — never a full render() here, or the guess
        // input and the live drawing/feed would keep getting yanked out
        // from under the player while they're mid-guess
        await refreshStageImage();
        await refreshPictFeed();
        const mine = await sGet(`lobby:${lobbyCode}:pictguess:${meta.pictRoundId}:${myId}`);
        if(mine && mine.correct) ui.pictGuessedCorrectly = true;
      }
      const guessKeys = await sListKeys(`lobby:${lobbyCode}:pictguess:${meta.pictRoundId}:`);
      const guessRecords = await Promise.all(guessKeys.map(k=>sGet(k)));
      const correctCount = guessRecords.filter(g=>g && g.correct).length;
      const totalGuessers = (meta.N||1) - 1;
      if((totalGuessers>0 && correctCount>=totalGuessers) || isPastDeadline()){
        await endPictRound();
        return;
      }
      if(statusChanged){ render(); }
      return;
    }

    if(meta.status==='pict_results'){
      if(statusChanged || !ui.pictResults) ui.pictResults = (await computePictResultsSummary()).display;
      render();
      return;
    }

    if(meta.status==='impression_record'){
      if(statusChanged){ ui.imprSubmitted=false; ui.imprRecordedBlob=null; ui.imprRecordedUrl=null; ui.imprMicDenied=false; }
      const mine = await sGet(`lobby:${lobbyCode}:imprsound:${meta.imprRoundId}:${myId}`);
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.imprSubmitted;
      ui.imprSubmitted = submittedByMe;
      const keys = await sListKeys(`lobby:${lobbyCode}:imprsound:${meta.imprRoundId}:`);
      ui.imprProgress = { count: keys.length, total: meta.N };
      if((isHost && keys.length>=meta.N) || isPastDeadline()){
        await startImpressionPlayback();
        return;
      }
      if(statusChanged || submissionChanged || ui.imprSubmitted){ render(); }
      return;
    }

    if(meta.status==='impression_playback'){
      if(statusChanged){
        imprLastPlayedIndex = -1; // -1 never matches a real index, so this always lets the current clip play
        render();
      }
      return;
    }

    if(meta.status==='impression_vote'){
      if(statusChanged){ ui.imprVoteSelected=null; ui.imprVoteSubmitted=false; }
      const mine = await sGet(`lobby:${lobbyCode}:imprvote:${meta.imprRoundId}:${myId}`);
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.imprVoteSubmitted;
      ui.imprVoteSubmitted = submittedByMe;
      const voteKeys = await sListKeys(`lobby:${lobbyCode}:imprvote:${meta.imprRoundId}:`);
      ui.imprVoteProgress = { count: voteKeys.length, total: meta.N };
      if((isHost && voteKeys.length>=meta.N) || isPastDeadline(VOTE_GRACE_SEC)){
        await finishImpressionRound();
        return;
      }
      if(statusChanged || submissionChanged || ui.imprVoteSubmitted){ render(); }
      return;
    }

    if(meta.status==='impression_round_results'){
      if(statusChanged || ui.imprRoundTally.length===0) ui.imprRoundTally = await computeImpressionTally();
      render();
      return;
    }

    if(meta.status==='codenames_setup'){
      const myTeam = (meta.cnTeams||{})[myId] || null;
      const myRole = (meta.cnRoles||{})[myId] || null;
      const teamChanged = myTeam!==ui.cnTeamPick || myRole!==ui.cnRolePick;
      ui.cnTeamPick = myTeam; ui.cnRolePick = myRole;
      const players = ui.players.length ? ui.players : await fetchPlayers();
      const everyonePicked = players.every(p=>(meta.cnTeams||{})[p.id] && (meta.cnRoles||{})[p.id]);
      if(everyonePicked || isPastDeadline(VOTE_GRACE_SEC)){
        await finalizeCodenamesSetup();
        return;
      }
      if(statusChanged || teamChanged){ render(); }
      return;
    }

    if(meta.status==='codenames_play'){
      if(isPastDeadline()){
        await passCodenamesTurn();
        return;
      }
      if(statusChanged){ render(); }
      return;
    }

    if(meta.status==='codenames_results'){
      render();
      return;
    }

    if(meta.status==='monopoly_play'){
      if(isPastDeadline()){
        await mpForceEndTurn();
        return;
      }
      if(statusChanged){
        // animate any player whose position moved a plausible dice-walk
        // distance since our last poll, so spectators see them walk too —
        // not just the person who actually rolled
        if(oldMpPositions){
          const walks = [];
          (meta.mpOrder||[]).forEach(p=>{
            const oldP = oldMpPositions[p];
            const newP = meta.mpPositions[p];
            if(oldP!==undefined && newP!==undefined && oldP!==newP && mpAnimOverride[p]===undefined){
              const dist = ((newP-oldP)+40)%40;
              if(dist>=1 && dist<=12) walks.push(mpAnimateTokenMove(p, oldP, dist));
            }
          });
          if(walks.length) await Promise.all(walks);
        }
        render();
      }
      return;
    }

    if(meta.status==='monopoly_results'){
      render();
      return;
    }

    if(meta.status==='sound_record'){
      if(statusChanged){ ui.soundSubmitted=false; ui.recordedBlob=null; ui.recordedUrl=null; ui.micDenied=false; }
      const mine = await sGet(soundKey(meta.soundRoundId, myId));
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.soundSubmitted;
      ui.soundSubmitted = submittedByMe;
      const keys = await sListKeys(`lobby:${lobbyCode}:sound:${meta.soundRoundId}:`);
      ui.soundProgress = {count: keys.length, total: meta.N};
      if(isPastDeadline()){
        await hostForceStartVote();
        return;
      }
      // Skip rebuilding the DOM while someone is mid-recording or typing a
      // fallback answer — a redraw here would drop their in-progress take.
      if(statusChanged || submissionChanged || ui.soundSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='sound_vote'){
      let entriesLoaded = false;
      if(statusChanged || ui.voteEntries.length===0){
        const keys = await sListKeys(`lobby:${lobbyCode}:sound:${meta.soundRoundId}:`);
        const entries = await Promise.all(keys.map(async k=>{
          const pid = k.split(':').pop();
          const v = await sGet(k);
          return v ? Object.assign({pid}, v) : null;
        }));
        ui.voteEntries = entries.filter(Boolean);
        ui.voteSelected=null; ui.voteSubmitted=false;
        entriesLoaded = true;
      }
      const mine = await sGet(voteKey(meta.soundRoundId, myId));
      const submittedByMe = !!mine;
      const submissionChanged = submittedByMe !== ui.voteSubmitted;
      ui.voteSubmitted = submittedByMe;
      const voteKeys = await sListKeys(`lobby:${lobbyCode}:vote:${meta.soundRoundId}:`);
      ui.voteProgress = {count: voteKeys.length, total: meta.N};
      if((isHost && voteKeys.length>=meta.N) || isPastDeadline(VOTE_GRACE_SEC)){
        ui.roundTally = await computeRoundTally(meta.soundRoundId);
        await awardRoundWinners(ui.roundTally);
        const newMeta = Object.assign({}, meta, {status:'sound_results'});
        await sSet(metaKey(), newMeta);
        meta = newMeta;
        render();
        return;
      }
      // Skip rebuilding the DOM while someone is mid-playback comparing takes —
      // a redraw would recreate the <audio> elements and stop playback.
      if(statusChanged || entriesLoaded || submissionChanged || ui.voteSubmitted){
        render();
      }
      return;
    }

    if(meta.status==='sound_results'){
      if(statusChanged || ui.roundTally.length===0) ui.roundTally = await computeRoundTally(meta.soundRoundId);
      render();
      return;
    }

    if(meta.status==='final'){
      if(statusChanged || ui.finalTally.length===0) ui.finalTally = await computeFinalTally();
      render();
      return;
    }
  }

  let pollTimer=null;
  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refreshAndRender, 1800);
  }

  (async function boot(){
    await initPayments();
    render();
  })();
})();
</script>
</body>
